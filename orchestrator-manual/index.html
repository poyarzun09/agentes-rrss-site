<html lang="es">
<head>

<title>Manual Maestro — Orchestrator Agéntico Local v4.0</title>
<style>
:root{
 --bg:#071016;--panel:#0d1821;--panel2:#111f2a;--line:#274152;--text:#eaf1f5;--muted:#92a9b7;
 --accent:#4fb3bf;--accent2:#81c995;--warn:#e5b56f;--danger:#dc8b7d;--shadow:0 14px 40px rgba(0,0,0,.32)
}
*{box-sizing:border-box} html,body{margin:0;height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
body{overflow:hidden}
a{color:inherit}
header{height:70px;display:flex;align-items:center;gap:16px;padding:0 18px;border-bottom:1px solid #203441;background:#071016;position:relative;z-index:10}
.brand{min-width:330px}.brand strong{font-size:18px}.brand span{display:block;color:var(--muted);font-size:12px;margin-top:4px}
.topbar{display:flex;gap:8px;align-items:center;flex:1}
button{font:inherit;border:1px solid #2b495b;background:#132631;color:var(--text);border-radius:9px;padding:8px 11px;cursor:pointer}
button:hover{background:#193442}
button.active{background:#214553;border-color:#4c879a}
input{font:inherit;background:#0b1720;color:var(--text);border:1px solid #2b495b;border-radius:9px;padding:9px 11px;outline:none}
.search{margin-left:auto;width:min(430px,36vw)}
.layout{height:calc(100% - 70px);display:grid;grid-template-columns:330px minmax(0,1fr)}
.sidebar{border-right:1px solid #203441;background:#09141c;overflow:auto;padding:14px}
.sidebar h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#8aa5b5;margin:4px 6px 10px}
.treeRow{display:flex;align-items:center;gap:6px;margin:2px 0}
.treeBtn{width:24px;height:24px;padding:0;border-radius:7px;flex:none}
.treeLink{flex:1;text-align:left;background:transparent;border:0;padding:7px 8px;border-radius:8px;color:#cfe0e8;cursor:pointer}
.treeLink:hover,.treeLink.selected{background:#132a38;color:#fff}
.main{overflow:auto;background:
 radial-gradient(circle at 15% 15%,rgba(79,179,191,.05),transparent 25%),
 radial-gradient(circle at 85% 75%,rgba(129,201,149,.04),transparent 30%),#071016}
.wrap{max-width:1280px;margin:0 auto;padding:24px}
.hero{background:linear-gradient(135deg,#102532,#0c1c26);border:1px solid #294b5d;border-radius:16px;padding:22px;box-shadow:var(--shadow)}
.hero .eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#8dc7ce}
.hero h1{font-size:30px;margin:7px 0 9px}
.hero p{margin:0;color:#bfd0d8;line-height:1.55}
.badges{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}.badge{font-size:11px;border:1px solid #315466;border-radius:999px;padding:5px 8px;color:#b8d1dc}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:14px}
.card{background:var(--panel);border:1px solid #223c4c;border-radius:14px;padding:16px}
.card h2,.card h3{margin:0 0 10px}.card h2{font-size:18px}.card h3{font-size:15px;color:#d9e8ef}
.card p,.card li{color:#bfd0d8;line-height:1.55}
.card ul,.card ol{padding-left:21px}
.full{grid-column:1/-1}
.kv{display:grid;grid-template-columns:180px 1fr;gap:8px 14px}
.kv div:nth-child(odd){color:#8ca8b8;font-weight:600}
.linkpill{display:inline-flex;align-items:center;gap:5px;border:1px solid #305264;background:#102531;border-radius:999px;padding:5px 9px;margin:3px 5px 3px 0;color:#cfe5ed;cursor:pointer;font-size:12px}
.linkpill:hover{background:#173544}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.flow .box{background:#122b38;border:1px solid #3b6073;border-radius:10px;padding:10px 12px;min-width:130px;text-align:center;cursor:pointer}
.flow .box:hover{border-color:#70b9c2}
.arrow{color:#6e91a3;font-size:18px}
.flowchart{display:grid;gap:10px}
.lane{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.laneLabel{width:150px;color:#8ca8b8;font-size:12px;font-weight:700}
.nodebox{background:#122936;border:1px solid #36596c;border-radius:10px;padding:8px 11px;cursor:pointer}
.nodebox:hover{background:#173544}
.note{border-left:3px solid var(--accent);padding:10px 12px;background:#0d2029;border-radius:8px;color:#bfd0d8}
.warn{border-left-color:var(--warn);background:#251e14}
.danger{border-left-color:var(--danger);background:#281816}
.diagram{overflow:auto;padding:12px;background:#08141b;border:1px solid #203b4a;border-radius:12px}
pre{white-space:pre-wrap;color:#c8d9e1;line-height:1.45;margin:0;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.sectionTitle{font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:#88a9ba;margin:20px 0 8px}
.breadcrumb{color:#7590a0;font-size:12px;margin-bottom:12px}
.back{margin-bottom:12px}
.status{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}.stat{background:#0e222c;border:1px solid #274553;border-radius:10px;padding:10px}.stat b{display:block;font-size:18px}.stat span{font-size:11px;color:#8ea8b6}
.manualToolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
@media(max-width:900px){body{overflow:auto}.layout{display:block;height:auto}.sidebar{position:relative;border-right:0;border-bottom:1px solid #203441;max-height:330px}.main{overflow:visible}.grid{grid-template-columns:1fr}.kv{grid-template-columns:1fr}.status{grid-template-columns:repeat(2,1fr)}header{height:auto;flex-wrap:wrap;padding:10px}.search{width:100%;margin:0}.brand{min-width:0}}
</style>
</head>

<script>
const TREE={"id":"root","title":"Orchestrator Agéntico Local v4.0","tag":"Proyecto","summary":"Es el sistema central que vamos a construir desde cero en el Mac Studio para convertir solicitudes del usuario en trabajo coordinado entre equipos de agentes. El Orchestrator decidirá qué equipo participa, qué agentes se activan, qué herramientas pueden usar, cómo se verifica el resultado y cómo queda registrado para poder continuar después.","details":["Baseline v4.0: arquitectura greenfield y almacenamiento por niveles; no parte del código del Orchestrator actual.","Host inicial: Mac Studio M1 Max, 32 GB de memoria unificada.","Estrategia: operación local, evidencia antes que afirmaciones y calidad por sobre velocidad.","El Orchestrator existente queda intacto. Sólo podrá consultarse para rescatar una idea útil; cualquier función reutilizada se rediseñará e implementará nuevamente bajo la arquitectura v4.0."],"children":[{"id":"vision","title":"1. Propósito y Visión","tag":"Dirección","summary":"Construir una plataforma local capaz de recibir objetivos de alto nivel, organizar equipos de agentes, ejecutar trabajo, verificarlo y mantener continuidad del proyecto.","details":["Desarrollo greenfield desde cero.","Calidad y certeza por sobre velocidad.","Autonomía controlada; el usuario conserva autoridad sobre acciones críticas.","Los agentes permanecen en STANDBY y se activan bajo demanda."],"children":[{"id":"greenfield","title":"Desarrollo desde cero (Greenfield)","summary":"El nuevo producto no se construye parchando el Orchestrator anterior.","details":["Repositorio nuevo.","DB y migraciones desde v1.","Tests desde el inicio.","Seguridad, QA y observabilidad by design."],"children":[{"id":"greenfield-detail-1-repositorio-nuevo","title":"Repositorio nuevo","summary":"Repositorio nuevo es un elemento concreto de Desarrollo desde cero (Greenfield); se representa como rama porque debe poder entenderse, controlarse y auditarse por separado.","details":[],"children":[]},{"id":"greenfield-detail-2-db-y-migraciones-desde-v1","title":"DB y migraciones desde v1","summary":"DB y migraciones desde v1 es un elemento concreto de Desarrollo desde cero (Greenfield); se representa como rama porque debe poder entenderse, controlarse y auditarse por separado.","details":[],"children":[]},{"id":"greenfield-detail-3-tests-desde-el-inicio","title":"Tests desde el inicio","summary":"Tests desde el inicio es un elemento concreto de Desarrollo desde cero (Greenfield); se representa como rama porque debe poder entenderse, controlarse y auditarse por separado.","details":[],"children":[]},{"id":"greenfield-detail-4-seguridad-qa-y-observabilidad-by-design","title":"Seguridad, QA y observabilidad by design","summary":"Control que impide avanzar con un riesgo no aceptado.","details":[],"children":[]}]},{"id":"localfirst","title":"Operación local como principio base","summary":"El sistema se ejecuta inicialmente en el Mac Studio, reduciendo dependencias externas.","details":["llama.cpp / llama-server como runtime local inicial.","Modelos GGUF locales.","VPS reservado como fase futura."],"children":[{"id":"localfirst-detail-1-llama-cpp-llama-server-como-runtime-local-inicial","title":"llama.cpp / llama-server como runtime local inicial","summary":"llama.cpp / llama-server como runtime local inicial es un elemento concreto de Operación local como principio base; se representa como rama porque debe poder entenderse, controlarse y auditarse por separado.","details":[],"children":[]},{"id":"localfirst-detail-2-modelos-gguf-locales","title":"Modelos GGUF locales","summary":"Modelos GGUF locales es un elemento concreto de Operación local como principio base; se representa como rama porque debe poder entenderse, controlarse y auditarse por separado.","details":[],"children":[]},{"id":"localfirst-detail-3-vps-reservado-como-fase-futura","title":"VPS reservado como fase futura","summary":"VPS reservado como fase futura es un elemento concreto de Operación local como principio base; se representa como rama porque debe poder entenderse, controlarse y auditarse por separado.","details":[],"children":[]}]},{"id":"quality","title":"Calidad y certeza antes que velocidad","summary":"La métrica prioritaria es resultado verificado, no velocidad bruta.","details":["Evidencia y herramientas reales.","Quality Gates.","Revisión independiente.","Golden Tasks y pruebas de regresión."],"children":[{"id":"quality-detail-1-evidencia-y-herramientas-reales","title":"Evidencia y herramientas reales","summary":"Respaldo verificable usado para justificar una decisión, resultado o afirmación.","details":[],"children":[]},{"id":"quality-detail-2-quality-gates","title":"Quality Gates","summary":"Quality Gates es un elemento concreto de Calidad y certeza antes que velocidad; se representa como rama porque debe poder entenderse, controlarse y auditarse por separado.","details":[],"children":[]},{"id":"quality-detail-3-revision-independiente","title":"Revisión independiente","summary":"Comprobación independiente realizada por un rol distinto del creador.","details":[],"children":[]},{"id":"quality-detail-4-golden-tasks-y-pruebas-de-regresion","title":"Golden Tasks y pruebas de regresión","summary":"Comprobación objetiva que demuestra si el comportamiento esperado se cumple.","details":[],"children":[]}]},{"id":"human","title":"Autoridad humana","summary":"Acciones críticas no pueden autoaprobarse por consenso o timeout.","details":["Finanzas reales.","Cambios críticos de seguridad.","Publicaciones sensibles.","Eliminación irreversible.","Cambios de privilegios."],"children":[{"id":"human-detail-1-finanzas-reales","title":"Finanzas reales","summary":"Finanzas reales es un elemento concreto de Autoridad humana; se representa como rama porque debe poder entenderse, controlarse y auditarse por separado.","details":[],"children":[]},{"id":"human-detail-2-cambios-criticos-de-seguridad","title":"Cambios críticos de seguridad","summary":"Control que impide avanzar con un riesgo no aceptado.","details":[],"children":[]},{"id":"human-detail-3-publicaciones-sensibles","title":"Publicaciones sensibles","summary":"Publicaciones sensibles es un elemento concreto de Autoridad humana; se representa como rama porque debe poder entenderse, controlarse y auditarse por separado.","details":[],"children":[]},{"id":"human-detail-4-eliminacion-irreversible","title":"Eliminación irreversible","summary":"Eliminación irreversible es un elemento concreto de Autoridad humana; se representa como rama porque debe poder entenderse, controlarse y auditarse por separado.","details":[],"children":[]},{"id":"human-detail-5-cambios-de-privilegios","title":"Cambios de privilegios","summary":"Cambios de privilegios es un elemento concreto de Autoridad humana; se representa como rama porque debe poder entenderse, controlarse y auditarse por separado.","details":[],"children":[]}]},{"id":"vision-detail-1-desarrollo-greenfield-desde-cero","title":"Desarrollo greenfield desde cero","summary":"Desarrollo greenfield desde cero es un elemento concreto de 1. Propósito y Visión; se representa como rama porque debe poder entenderse, controlarse y auditarse por separado.","details":[],"children":[]},{"id":"vision-detail-2-calidad-y-certeza-por-sobre-velocidad","title":"Calidad y certeza por sobre velocidad","summary":"Calidad y certeza por sobre velocidad es un elemento concreto de 1. Propósito y Visión; se representa como rama porque debe poder entenderse, controlarse y auditarse por separado.","details":[],"children":[]},{"id":"vision-detail-3-autonomia-controlada-el-usuario-conserva-autoridad-s","title":"Autonomía controlada; el usuario conserva autoridad sobre acciones críticas","summary":"Autonomía controlada; el usuario conserva autoridad sobre acciones críticas es un elemento concreto de 1. Propósito y Visión; se representa como rama porque debe poder entenderse, controlarse y auditarse por separado.","details":[],"children":[]},{"id":"vision-detail-4-los-agentes-permanecen-en-standby-y-se-activan-bajo-","title":"Los agentes permanecen en STANDBY y se activan bajo demanda","summary":"Los agentes permanecen en STANDBY y se activan bajo demanda es un elemento concreto de 1. Propósito y Visión; se representa como rama porque debe poder entenderse, controlarse y auditarse por separado.","details":[],"children":[]}]},{"id":"core","title":"2. Arquitectura central del Orchestrator","tag":"Arquitectura central","summary":"Arquitectura central del nuevo Orchestrator greenfield. Cada componente se expande hasta mostrar sus responsabilidades, flujo interno, decisiones, datos que consume, resultados y controles.","details":["Cada módulo tendrá responsabilidad y contrato definidos para que pueda probarse y evolucionar sin acoplar todo el sistema.","Las tareas, agentes y aprobaciones sólo podrán pasar entre estados permitidos por código; no dependerán de texto libre generado por el LLM.","Los procesos de trabajo se definirán como configuraciones versionables, no como secuencias ocultas dentro de prompts.","Cada decisión, herramienta, modelo, prompt, resultado, aprobación y control de QA quedará relacionado con la tarea correspondiente."],"children":[{"id":"pmo","title":"PMO y Gerencia del Proyecto","summary":"El PMO será la memoria operativa del proyecto completo. Antes de iniciar una sesión reconstruirá el estado desde la base persistente y documentos de control; al cerrar una sesión actualizará avances, riesgos, decisiones, cambios de alcance, checkpoint y próxima acción.","details":["Carta Gantt, estructura de desglose del trabajo (WBS) y backlog.","Riesgos y problemas activos.","Registro de decisiones.","Registro de alcance.","Registro de dependencias.","Registro de entregables.","Punto de control actual.","Índice maestro de conocimiento del proyecto.","Estado y consistencia de la documentación.","Protocolo RETOMAR PROYECTO."],"children":[{"id":"pmo-detail-1-carta-gantt-estructura-de-desglose-del-trabajo-wbs-y","title":"Carta Gantt, estructura de desglose del trabajo (WBS) y backlog","summary":"Carta Gantt, estructura de desglose del trabajo (WBS) y backlog es un elemento concreto de PMO y Gerencia del Proyecto; se representa como rama porque debe poder entenderse, controlarse y auditarse por separado.","details":[],"children":[]},{"id":"pmo-detail-2-riesgos-y-problemas-activos","title":"Riesgos y problemas activos","summary":"Riesgos y problemas activos es un elemento concreto de PMO y Gerencia del Proyecto; se representa como rama porque debe poder entenderse, controlarse y auditarse por separado.","details":[],"children":[]},{"id":"pmo-detail-3-registro-de-decisiones","title":"Registro de decisiones","summary":"Registro de decisiones es un elemento concreto de PMO y Gerencia del Proyecto; se representa como rama porque debe poder entenderse, controlarse y auditarse por separado.","details":[],"children":[]},{"id":"pmo-detail-4-registro-de-alcance","title":"Registro de alcance","summary":"Registro de alcance es un elemento concreto de PMO y Gerencia del Proyecto; se representa como rama porque debe poder entenderse, controlarse y auditarse por separado.","details":[],"children":[]},{"id":"pmo-detail-5-registro-de-dependencias","title":"Registro de dependencias","summary":"Registro de dependencias es un elemento concreto de PMO y Gerencia del Proyecto; se representa como rama porque debe poder entenderse, controlarse y auditarse por separado.","details":[],"children":[]},{"id":"pmo-detail-6-registro-de-entregables","title":"Registro de entregables","summary":"Registro de entregables es un elemento concreto de PMO y Gerencia del Proyecto; se representa como rama porque debe poder entenderse, controlarse y auditarse por separado.","details":[],"children":[]},{"id":"pmo-detail-7-punto-de-control-actual","title":"Punto de control actual","summary":"Punto de control actual es un elemento concreto de PMO y Gerencia del Proyecto; se representa como rama porque debe poder entenderse, controlarse y auditarse por separado.","details":[],"children":[]},{"id":"pmo-detail-8-indice-maestro-de-conocimiento-del-proyecto","title":"Índice maestro de conocimiento del proyecto","summary":"Índice maestro de conocimiento del proyecto es un elemento concreto de PMO y Gerencia del Proyecto; se representa como rama porque debe poder entenderse, controlarse y auditarse por separado.","details":[],"children":[]},{"id":"pmo-detail-9-estado-y-consistencia-de-la-documentacion","title":"Estado y consistencia de la documentación","summary":"Estado y consistencia de la documentación es un elemento concreto de PMO y Gerencia del Proyecto; se representa como rama porque debe poder entenderse, controlarse y auditarse por separado.","details":[],"children":[]},{"id":"pmo-detail-10-protocolo-retomar-proyecto","title":"Protocolo RETOMAR PROYECTO","summary":"Protocolo RETOMAR PROYECTO es un elemento concreto de PMO y Gerencia del Proyecto; se representa como rama porque debe poder entenderse, controlarse y auditarse por separado.","details":[],"children":[]}]},{"id":"task","title":"Gestión del ciclo de vida de las tareas","summary":"Administrará cada trabajo desde que se crea hasta que queda validado o bloqueado. Evitará que un agente marque una tarea como terminada sin pruebas, QA, evidencia y aprobaciones exigidas por su Definition of Done.","details":["CREATED, PLANNING, QUEUED, RUNNING, VERIFYING, WAITING_APPROVAL, BLOCKED, FAILED, DONE, CANCELLED, PAUSED.","Dependencias y prioridades.","Persistencia de estado."],"children":[{"id":"tm-start","title":"Creación y planificación","summary":"Registra la tarea y pasa a PLANNING sólo cuando tiene objetivo suficiente.","details":[],"children":[{"id":"tm-start-id","title":"Identidad","summary":"task_id, proyecto, prioridad, owner y timestamp.","details":[],"children":[]},{"id":"tm-start-scope","title":"Alcance","summary":"Objetivo, restricciones y Definition of Done.","details":[],"children":[]}]},{"id":"tm-ready","title":"Cola y preparación","su a de las tareas; se representa como rama porque debe poder entenderse, controlarse y auditarse por separado.","details":[],"children":[]},{"id":"task-detail-2-dependencias-y-prioridades","title":"Dependencias y prioridades","summary":"Dependencias y prioridades es un elemento concreto de Gestión del ciclo de vida de las tareas; se representa como rama porque debe poder entenderse, controlarse y auditarse por separado.","details":[],"children":[]},{"id":"task-detail-3-persistencia-de-estado","title":"Persistencia de estado","summary":"Persistencia de estado es un elemento concreto de Gestión del ciclo de vida de las tareas; se representa como rama porque debe poder entenderse, controlarse y auditarse por separado.","details":[],"children":[]}]},{"id":"planner","title":"Planificador de tareas y descomposición del trabajo","summary":"Cuando el usuario entregue una solicitud de alto nivel, este componente la dividirá en pasos concretos, identificará dependencias, decidirá qué equipo debe intervenir y construirá el plan antes de activar agentes. No ejecutará trabajo directamente: prepara la estrategia.","details":["Objetivos y restricciones.","Selección de equipo.","Dependencias.","Gates y checkpoints."],"children":[{"id":"tp-in","title":"1. Entrada de la solicitud","summary":"Recibe la necesidad de alto nivel del usuario y la convierte en una especificación operable.","details":[],"children":[{"id":"tp-in-obj","title":"Objetivo","summary":"Qué resultado final espera el usuario y cómo se reconocerá que está cumplido.","details":[],"children":[]},{"id":"tp-in-constraints","title":"Restricciones","summary":"Tiempo, seguridad, almacenamiento, herramientas, fuentes y límites explícitos.","details":[],"children":[]},{"id":"tp-in-dod","title":"Criterios de aceptación","summary":"Definition of Done, evidencia y formato esperado.","details":[],"children":[]}]},{"id":"tp-analysis","title":"2. Análisis de la tarea","summary":"Determina complejidad, dominio, riesgo y dependencias." onsiderando RAM, contexto y recursos disponibles","summary":"Planificación considerando RAM, contexto y recursos disponibles es un elemento concreto de Planificador de ejecución y uso de recursos; se representa como rama porque debe poder entenderse, controlarse y auditarse por separado.","details":[],"children":[]}]},{"id":"workflow","title":"Motor de flujos de trabajo y orquestación","summary":"Será el motor que recorra los pasos de cada proceso: planificar, ejecutar, verificar, corregir, aprobar y cerrar. Podrá pausar una tarea, esperar una herramienta o aprobación, guardar checkpoint y continuar sin empezar de cero.","details":["Dependencias.","Condiciones.","Reintentos limitados y controlados.","Checkpoint/resume.","Aprobaciones humanas.","Transferencias estructuradas entre agentes."],"children":[{"id":"wf-load","title":"Cargar workflow versionado","summary":"Selecciona la definición aplicable a la tarea.","details":[],"children":[{"id":"wf-load-schema","title":"Validar esquema","summary":"Comprueba que steps, dependencies, gates y policies sean válidos.","details":[],"children":[]},{"id":"wf-load-version","title":"Fijar versión","summary":"La tarea queda vinculada a una versión concreta del workflow.","details":[],"children":[]}]},{"id":"wf-step","title":"Ejecutar steps","summary":"Procesa cada paso según dependencias y condiciones.","details":[],"children":[{"id":"wf-step-input","title":"Preparar inputs","summary":"Contexto, artifacts, memoria y tools permitidas.","details":[],"children":[]},{"id":"wf-step-agent","title":"Despachar agente","summary":"Scheduler activa la sesión lógica correspondiente.","details":[],"children":[]},{"id":"wf-step-output","title":"Capturar output","summary":"Registra resultado estructurado, artifacts y evidencia.","details":[],"children":[]}]},{"id":"wf-gate","title":"Evaluar gates","summary":"Decide si el flujo avanza, corrige, espera o escala.","details":[],"children":[{"id":"wf-gate-qa","title":"QA Gate","summary":"Requisitos, or de políticas y reglas de operación","summary":"Concentrará reglas que deben cumplirse en todo el Orchestrator: mínimo privilegio, acciones prohibidas, requisitos de QA, restricciones financieras, límites de publicación y reglas de seguridad. Así evitamos repetir reglas contradictorias en cada prompt.","details":["Todo se deniega por defecto salvo autorización explícita.","Políticas versionadas.","Aplicación antes de Tool Gateway."],"children":[{"id":"policy-detail-1-todo-se-deniega-por-defecto-salvo-autorizacion-expli","title":"Todo se deniega por defecto salvo autorización explícita","summary":"Todo se deniega por defecto salvo autorización explícita es un elemento concreto de Motor de políticas y reglas de operación; se representa como rama porque debe poder entenderse, controlarse y auditarse por separado.","details":[],"children":[]},{"id":"policy-detail-2-politicas-versionadas","title":"Políticas versionadas","summary":"Políticas versionadas es un elemento concreto de Motor de políticas y reglas de operación; se representa como rama porque debe poder entenderse, controlarse y auditarse por separado.","details":[],"children":[]},{"id":"policy-detail-3-aplicacion-antes-de-tool-gateway","title":"Aplicación antes de Tool Gateway","summary":"Aplicación antes de Tool Gateway es un elemento concreto de Motor de políticas y reglas de operación; se representa como rama porque debe poder entenderse, controlarse y auditarse por separado.","details":[],"children":[]}]},{"id":"context","title":"Gestión inteligente del contexto","summary":"Seleccionará sólo la información necesaria para la tarea actual: políticas, requisitos, evidencia, estado, memoria relevante y documentos específicos. Esto evita desperdiciar contexto de Qwen cargando todo el proyecto en cada llamada.","details":["Prioriza políticas, objetivo, requisitos, evidencia y estado.","Evita inyectar repositorios o memorias completas sin necesidad.","Perfiles de contexto sujetos a benchmark."],"children":[{"id": const byId=new Map(NODES.map(n=>[n.id,n]));
let expanded=new Set([TREE.id,...(TREE.children||[]).map(x=>x.id)]);
let selected=TREE.id;

function descendants(id){
 const out=[]; const n=byId.get(id); if(!n)return out;
 const q=[...(n.children||[])];
 while(q.length){const x=q.shift();out.push(x);const k=byId.get(x);if(k)q.push(...(k.children||[]))}
 return out;
}
function ancestors(id){
 const out=[];let n=byId.get(id);while(n&&n.parent){const p=byId.get(n.parent);if(!p)break;out.unshift(p);n=p}return out;
}
function renderTree(){
 const host=document.getElementById('tree');host.innerHTML='';
 const q=(document.getElementById('search').value||'').toLowerCase().trim();
 function rec(n,depth){
   const match=!q || (n.title+' '+(n.summary||'')).toLowerCase().includes(q) || descendants(n.id).some(id=>{const x=byId.get(id);return x&&(x.title+' '+x.summary).toLowerCase().includes(q)});
   if(!match)return;
   const row=document.createElement('div');row.className='treeRow';row.style.paddingLeft=(depth*13)+'px';
   const has=(n.children||[]).length>0;
   const b=document.createElement('button');b.className='treeBtn';b.textContent=has?(expanded.has(n.id)?'−':'+'):'·';b.disabled=!has;
   b.onclick=()=>{if(!has)return;if(expanded.has(n.id))expanded.delete(n.id);else expanded.add(n.id);renderTree()};
   const a=document.createElement('button');a.className='treeLink'+(selected===n.id?' selected':'');a.textContent=n.title;a.onclick=()=>openNode(n.id);
   row.append(b,a);host.appendChild(row);
   if(has&&(expanded.has(n.id)||q))(n.children||[]).forEach(c=>rec(c,depth+1));
 }
 rec(TREE,0);
}
function link(id,label){
 const n=byId.get(id); if(!n)return '';
 return '<button class="linkpill" onclick="openNode(\''+id+'\')">'+(label||n.title)+'</button>';
}
function breadcrumb(n){
 return [...ancestors(n.id),n].map(x=>'<span>'+x.title+'</span>').join(' › ');
}
function classify(n){
 const path=[...ancestors(n.id),n].map(x=>x.title).join(' > ');
 if(/PMO|proyecto/i.test(path))return 'PMO y continuidad';
 if(/QA|calidad|verificación/i.test(path))return 'Calidad y verificación';
 if(/Ciberseguridad|SecOps|seguridad/i.test(path))return 'Seguridad';
 if(/Almacenamiento|SSD|Storage/i.test(path))return 'Infraestructura de almacenamiento';
 if(/Runtime|modelo|llama|Agent Runtime|Gateway/i.test(path))return 'Runtime e IA local';
 if(/Software|Desarrollo/i.test(path))return 'Ingeniería de software';
 if(/Comunicaciones/i.test(path))return 'Comunicaciones';
 if(/Finanzas/i.test(path))return 'Finanzas';
 if(/Comercial/i.test(path))return 'Comercial';
 if(/Contenidos/i.test(path))return 'Content Studio';
 if(/Workflow|Flujos/i.test(path))return 'Orquestación';
 return 'Arquitectura general';
}
function manualProfile(n){
 const title=n.title, parent=n.parent?byId.get(n.parent):null, kids=(n.children||[]).map(id=>byId.get(id)).filter(Boolean);
 const cat=classify(n);
 const desc=n.summary||('Función o componente del Orchestrator responsable de '+title+'.');
 const objective='Definir de forma explícita la responsabilidad de «'+title+'», sus entradas, decisiones, salidas y relaciones, de modo que pueda implementarse, probarse, auditarse y mantenerse sin depender de conocimiento tácito.';
 const inputs=[];
 const outputs=[];
 const rel=[];
 if(parent)inputs.push('Contexto y estado entregado por '+parent.title);
 if(n.details?.length)inputs.push(...n.details.slice(0,4));
 if(kids.length)outputs.push('Resultados producidos por sus subfunciones: '+kids.slice(0,5).map(x=>x.title).join(', ')+(kids.length>5?'…':''));
 else outputs.push('Salida estructurada consumible por el siguiente componente del flujo');
 if(parent)rel.push(parent.id);
 for(const k of kids.slice(0,6))rel.push(k.id);
 const path=[...ancestors(n.id),n].map(x=>x.title);
 const cross=NODES.filter(x=>x.id!==n.id && x.title!==n.title && (
   (title.toLowerCase().includes('task') && /Workflow|Scheduler|PMO|Audit/i.test(x.title)) ||
   (/workflow/i.test(title) && /Scheduler|Agent Runtime|Approval|QA|Audit/i.test(x.title)) ||
   (/qa|calidad/i.test(title) && /Verification|Audit|Learning|Workflow/i.test(x.title)) ||
   (/permission|approval/i.test(title) && /Policy|Tool Gateway|Audit/i.test(x.title))
 )).slice(0,6).map(x=>x.id);
 for(const x of cross)if(!rel.includes(x))rel.push(x);
 return {cat,desc,objective,inputs,outputs,rel,path,kids};
}
function flowFor(n){
 const t=n.title.toLowerCase();
 if(n.id===TREE.id)return ['Usuario / UI','Task Manager','Task Planner','Team Manager / Agent Registry','Scheduler','Workflow Engine','Permission / Policy / Approval','Context / Memory / Knowledge','Agent Runtime','Model Gateway / llama-server','Tool Gateway','Verification / QA','Learning / Audit','PMO / Checkpoint','Resultado al usuario'];
 if(t.includes('planner'))return ['Solicitud','Analizar objetivo','Detectar restricciones','Descomponer','Resolver dependencias','Seleccionar equipo/agentes','Definir gates','Emitir plan'];
 if(t.includes('workflow'))return ['Cargar workflow','Validar definición','Resolver dependencias','Ejecutar step','Evaluar gate','Retry / escalamiento','Checkpoint','Siguiente step / cierre'];
 if(t.includes('qa')||t.includes('calidad'))return ['Recibir resultado','Mapear requisito','Ejecutar pruebas','Revisar evidencia','Revisión independiente','¿Cumple?','Aprobar / corregir / rechazar'];
 if(t.includes('permission'))return ['Solicitud de acción','Identificar agente','Clasificar riesgo','Consultar política','¿Permitido?','AUTO / SUPERVISED / APPROVAL_REQUIRED / FORBIDDEN','Auditar decisión'];
 if(t.includes('approval'))return ['Acción crítica','Crear approval','WAITING_APPROVAL','Decisión humana','APPROVED / REJECTED','Reanudar o cancelar','Auditar'];
 if(t.includes('checkpoint'))return ['Capturar estado','Guardar workflow/version','Guardar step','Referenciar artifacts','Guardar decisiones','Validar hashes','Persistir','Resume'];
 if(t.includes('storage')||t.includes('almacenamiento'))return ['Resolver root','Validar volumen','Validar identidad','Validar espacio','Leer / escribir','Registrar artifact','Health / degraded mode'];
 if(t.includes('secops'))return ['Monitor','Security Event','Triage','Clasificar severidad','Respuesta L1/L2/L3','Evidencia','Cierre','Lesson Learned'];
 return kidsFlow(n);
}
function kidsFlow(n){
 const kids=(n.children||[]).map(id=>byId.get(id)).filter(Boolean);
 if(kids.length)return ['Entrada',...kids.slice(0,8).map(x=>x.title),'Salida'];
 return ['Entrada validada','Ejecutar responsabilidad de '+n.title,'Aplicar reglas','Generar salida','Registrar evidencia','Entregar al siguiente componente'];
}
function caseStudy(n){
 const cat=classify(n);
 if(cat==='Ingeniería de software')return 'Caso ficticio: NovaSur Digital solicita una nueva función de checkpoint/resume. La función «'+n.title+'» participa en su etapa correspondiente dentro del repositorio greenfield nuevo. El trabajo debe producir un resultado verificable, pasar revisión y mantener intacto el Orchestrator antiguo.';
 if(cat==='PMO y continuidad')return 'Caso ficticio: al terminar una jornada quedan dos tareas completas y una bloqueada por el SSD externo. «'+n.title+'» registra o utiliza ese estado para que al día siguiente RETOMAR PROYECTO reconstruya exactamente dónde quedó el trabajo.';
 if(cat==='Calidad y verificación')return 'Caso ficticio: una función nueva parece correcta, pero QA detecta una diferencia entre resultado esperado y observado. «'+n.title+'» interviene para demostrar el problema, devolver la tarea a corrección y permitir cierre sólo después del retest.';
 if(cat==='Seguridad')return 'Caso ficticio: una nueva tool funciona técnicamente, pero intenta operar fuera de su ámbito autorizado. «'+n.title+'» participa en detectar, bloquear, registrar y verificar la corrección antes de permitir producción.';
 if(cat==='Infraestructura de almacenamiento')return 'Caso ficticio: el SSD externo se desconecta durante una sesión. «'+n.title+'» debe preservar el Core y el estado crítico, bloquear sólo las operaciones dependientes del volumen y evitar copias silenciosas al SSD interno.';
 return 'Caso ficticio: TASK-DEMO-001 requiere «'+n.title+'». El Orchestrator entrega entradas verificadas, ejecuta la función, registra decisiones y evidencia y sólo permite avanzar cuando la salida cumple las condiciones definidas.';
}
function openNode(id){
 const n=byId.get(id);if(!n)return;selected=id;renderTree();
 if(id===TREE.id){renderRoot();return}
 const p=manualProfile(n);
 const flow=flowFor(n);
 const html='<div class="back"><button onclick="renderRoot()">← Vista maestra</button></div>'+
 '<div class="hero"><div class="eyebrow">'+p.cat+'</div><h1>'+n.title+'</h1><div class="breadcrumb">'+breadcrumb(n)+'</div><p>'+p.desc+'</p><div class="badges"><span class="badge">ID: '+n.id+'</span><span class="badge">'+p.cat+'</span><span class="badge">'+(n.children||[]).length+' subfunciones</span></div></div>'+
 '<div class="grid">'+
 '<section class="card"><h2>Objetivo</h2><p>'+p.objective+'</p></section>'+
 '<section class="card"><h2>Ubicación en el sistema</h2><div class="kv"><div>Ruta</div><div>'+p.path.join(' → ')+'</div><div>Padre</div><div>'+(n.parent?link(n.parent):'Raíz del sistema')+'</div><div>Categoría</div><div>'+p.cat+'</div></div></section>'+
 '<section class="card full"><h2>Flujo funcional</h2><div class="flow">'+flow.map((x,i)=>'<div class="box">'+x+'</div>'+(i<flow.length-1?'<span class="arrow">→</span>':'')).join('')+'</div></section>'+
 '<section class="card"><h2>Entradas</h2><ul>'+p.inputs.map(x=>'<li>'+x+'</li>').join('')+'</ul></section>'+
 '<section class="card"><h2>Salidas</h2><ul>'+p.outputs.map(x=>'<li>'+x+'</li>').join('')+'</ul></section>'+
 '<section class="card"><h2>Subfunciones</h2>'+(p.kids.length?p.kids.map(x=>link(x.id)).join(''):'<p>No tiene subfunciones documentadas por debajo de este nodo.</p>')+'</section>'+
 '<section class="card"><h2>Relaciones navegables</h2>'+p.rel.map(x=>link(x)).join('')+'</section>'+
 '<section class="card full"><h2>Proceso y lógica</h2><ol>'+flow.map((x,i)=>'<li><b>Paso '+(i+1)+':</b> '+x+'.</li>').join('')+'</ol></section>'+
 '<section class="card"><h2>Estados y decisiones</h2><ul><li>Valida precondiciones antes de ejecutar.</li><li>Puede continuar, bloquear, devolver a corrección o escalar según políticas.</li><li>Las transiciones deben ser persistidas y auditables.</li></ul></section>'+
 '<section class="card"><h2>Permisos y políticas</h2><ul><li>Mínimo privilegio.</li><li>Deny-by-default para acciones no autorizadas.</li><li>Approval Engine para acciones críticas cuando aplique.</li></ul></section>'+
 '<section class="card"><h2>Persistencia y auditoría</h2><ul><li>task_id / step_id</li><li>estado antes y después</li><li>versiones de workflow, prompt/modelo cuando apliquen</li><li>evidencia y artifacts relacionados</li><li>timestamp y actor/agente</li></ul></section>'+
 '<section class="card"><h2>QA y criterios de aceptación</h2><ul><li>Entradas completas y válidas.</li><li>Salida estructurada y verificable.</li><li>Pruebas aplicables aprobadas.</li><li>Sin findings críticos abiertos.</li><li>Definition of Done satisfecha.</li></ul></section>'+
 '<section class="card full"><h2>Ejemplo ficticio didáctico</h2><div class="note">'+caseStudy(n)+'</div></section>'+
 '<section class="card"><h2>Qué ocurre si falla</h2><p>El flujo no debe continuar silenciosamente. La función registra causa y evidencia, cambia el estado correspondiente y aplica retry, corrección, bloqueo o escalamiento según política.</p></section>'+
 '<section class="card"><h2>Definition of Done de esta función</h2><ul><li>Responsabilidad ejecutada.</li><li>Salida válida.</li><li>Evidencia registrada.</li><li>Relaciones y dependencias satisfechas.</li><li>QA/seguridad/aprobaciones cumplidas cuando corresponda.</li></ul></section>'+
 '</div>';
 document.getElementById('content').innerHTML=html;
 document.querySelector('.main').scrollTop=0;
}
function renderRoot(){
 selected=TREE.id;renderTree();
 const html='<div class="hero"><div class="eyebrow">Vista maestra del sistema</div><h1>Orchestrator Agéntico Local v4.0</h1><p>Manual técnico interactivo del proyecto greenfield. Esta vista explica cómo está construido el sistema completo, cómo fluye una tarea de extremo a extremo y cómo se conectan arquitectura, runtime, agentes, QA, PMO, seguridad, almacenamiento e infraestructura.</p>'+
 '<div class="badges"><span class="badge">Greenfield</span><span class="badge">Local-first</span><span class="badge">Mac Studio M1 Max · 32 GB</span><span class="badge">Human-in-the-loop</span><span class="badge">Evidence-first</span></div>'+
 '<div class="status"><div class="stat"><b>'+NODES.length+'</b><span>Nodos documentados</span></div><div class="stat"><b>'+TREE.children.length+'</b><span>Ramas principales</span></div><div class="stat"><b>DEV / TEST / PROD</b><span>Entornos</span></div><div class="stat"><b>Greenfield</b><span>Sin modificar el Orchestrator actual</span></div></div></div>'+
 '<div class="grid">'+
 '<section class="card full"><h2>Flowchart maestro end-to-end</h2><div class="flowchart">'+
 lane('Entrada',['Usuario / UI','Task Manager','Task Planner'])+
 lane('Organización',['Team Manager','Agent Registry','Scheduler'])+
 lane('Orquestación',['Workflow Engine','Permission / Policy / Approval'])+
 lane('Contexto',['Context Manager','Memory Manager','Knowledge Manager'])+
 lane('Ejecución',['Agent Runtime','Model Gateway','llama-server','Tool Gateway'])+
 lane('Control',['Verification Engine','QA Engine','Security Gate'])+
 lane('Continuidad',['Learning Engine','Audit Engine','PMO / Checkpoint'])+
 lane('Salida',['Resultado validado','Usuario'])+
 '</div></section>'+
 '<section class="card"><h2>Arquitectura</h2><p>Core modular, runtime local, agentes lógicos, tool gateway y servicios transversales.</p>'+link(findByTitle('2. Arquitectura central del Orchestrator'))+'</section>'+
 '<section class="card"><h2>Infraestructura</h2><p>Mac Studio, almacenamiento por niveles, llama-server, DB activa, logs, backups y entornos.</p>'+link(findByTitle('12. Almacenamiento por Niveles'))+'</section>'+
 '<section class="card"><h2>Gobierno y PMO</h2><p>Plan, Gantt, backlog, decisiones, riesgos, alcance, dependencias, checkpoints y continuidad.</p>'+link(findByTitle('9. PMO y Continuidad'))+'</section>'+
 '<section class="card"><h2>Calidad y seguridad</h2><p>QA, verificación, aprendizaje, Cybersecurity y SecOps como controles independientes.</p>'+link(findByTitle('8. QA, Verificación y Aprendizaje'))+link(findByTitle('10. Ciberseguridad preventiva y preproducción'))+'</section>'+
 '<section class="card full"><h2>Principio de construcción</h2><div class="note warn"><b>El Orchestrator actual no se modifica ni se migra.</b> Este manual describe el nuevo sistema greenfield: repositorio nuevo, venv nuevo, DB nueva, migrations desde v1 y controles de calidad/seguridad desde el inicio.</div></section>'+
 '</div>';
 document.getElementById('content').innerHTML=html;
 document.querySelector('.main').scrollTop=0;
}
function lane(label,items){return '<div class="lane"><div class="laneLabel">'+label+'</div>'+items.map(x=>{const id=findByTitleLoose(x);return id?'<button class="nodebox" onclick="openNode(\''+id+'\')">'+x+'</button>':'<span class="nodebox">'+x+'</span>'}).join('<span class="arrow">→</span>')+'</div>'}
function findByTitle(title){const n=NODES.find(x=>x.title===title);return n?n.id:''}
function findByTitleLoose(title){
 const q=title.toLowerCase();
 const n=NODES.find(x=>x.title.toLowerCase()===q)||NODES.find(x=>x.title.toLowerCase().includes(q.split(' / ')[0].toLowerCase()))||NODES.find(x=>q.includes(x.title.toLowerCase()));
 return n?n.id:'';
}
function renderArchitecture(){const id=findByTitle('2. Arquitectura central del Orchestrator');if(id)openNode(id);else renderRoot()}
function renderInfra(){const id=findByTitle('12. Almacenamiento por Niveles');if(id)openNode(id);else renderRoot()}
function renderFlow(){renderRoot();setTimeout(()=>document.querySelector('.flowchart')?.scrollIntoView({behavior:'smooth'}),50)}
document.getElementById('rootBtn').onclick=renderRoot;
document.getElementById('archBtn').onclick=renderArchitecture;
document.getElementById('infraBtn').onclick=renderInfra;
document.getElementById('flowBtn').onclick=renderFlow;
document.getElementById('search').addEventListener('input',renderTree);
renderTree();renderRoot();
</script>
</body></html>
