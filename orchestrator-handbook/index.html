<style>
:root{--bg:#071018;--panel:#0d1922;--panel2:#101f2a;--line:#203847;--line2:#315466;--text:#e7eef2;--muted:#91a6b3;--accent:#55b8c5;--accent2:#80c99b;--warn:#e2b46b;--danger:#e28e7e;--code:#0a141b;--shadow:0 16px 42px rgba(0,0,0,.28)}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
body{overflow:hidden}button,input{font:inherit}.app{height:100%;display:grid;grid-template-rows:64px 1fr}
header{display:flex;align-items:center;gap:12px;padding:0 16px;background:#08121a;border-bottom:1px solid var(--line);z-index:20}
.logo{font-weight:800;letter-spacing:-.02em}.logo small{display:block;color:var(--muted);font-weight:500;font-size:11px;margin-top:2px}
.search{margin-left:auto;width:min(520px,42vw);position:relative}.search input{width:100%;background:#0d1a23;border:1px solid #294657;color:var(--text);border-radius:10px;padding:9px 12px;outline:none}.searchResults{position:absolute;left:0;right:0;top:44px;background:#0b1720;border:1px solid #315164;border-radius:12px;box-shadow:var(--shadow);max-height:430px;overflow:auto;display:none;z-index:50}.searchItem{padding:10px 12px;border-bottom:1px solid #1c3240;cursor:pointer}.searchItem:hover{background:#132735}.searchItem b{display:block}.searchItem span{font-size:11px;color:var(--muted)}

.navTitle{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:#6f8998;margin:12px 8px 7px}.navBtn{width:100%;text-align:left;border:0;background:transparent;color:#c7d6de;padding:9px 10px;border-radius:9px;cursor:pointer;margin:2px 0}.navBtn:hover,.navBtn.active{background:#142a37;color:#fff}.navBtn .sub{display:block;font-size:10px;color:#78909d;margin-top:2px}
main{overflow:auto}.wrap{max-width:1240px;margin:0 auto;padding:24px 28px 60px}
.hero{background:linear-gradient(135deg,#102633,#0c1c26);border:1px solid #294c5e;border-radius:16px;padding:24px;box-shadow:var(--shadow)}.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:#80c8d1}.hero h1{font-size:31px;margin:6px 0 10px;letter-spacing:-.025em}.hero p{margin:0;color:#c0d0d8;line-height:1.6;max-width:980px}
.badges{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}.badge{font-size:11px;border:1px solid #315466;border-radius:999px;padding:5px 8px;color:#bad0db}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:14px}.card{background:var(--panel);border:1px solid #203b4a;border-radius:14px;padding:17px}.full{grid-column:1/-1}.card h2{font-size:17px;margin:0 0 10px}.card h3{font-size:14px;margin:0 0 8px}.card p,.card li{color:#bccdd5;line-height:1.55}.card ul,.card ol{padding-left:20px}
.callout{border-left:3px solid var(--accent);background:#0d222c;border-radius:9px;padding:11px 13px;color:#bfd0d8}.callout.warn{border-color:var(--warn);background:#241e14}.callout.good{border-color:var(--accent2);background:#102119}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0 0}.tab{border:1px solid #2b4c5d;background:#10232e;color:#c8d8e0;padding:8px 11px;border-radius:9px;cursor:pointer}.tab.active{background:#1f4755;border-color:#5a94a5;color:#fff}
.breadcrumb{font-size:11px;color:#7d94a1;margin:0 0 9px}.crumb{cursor:pointer}.crumb:hover{color:#cde4eb}
.diagram{background:#08151d;border:1px solid #203b4a;border-radius:13px;padding:15px;overflow:auto}.lane{display:grid;grid-template-columns:140px 1fr;gap:10px;margin:9px 0;align-items:center}.laneLabel{font-size:11px;color:#7e98a7;font-weight:700;text-transform:uppercase;letter-spacing:.06em}.laneFlow{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.box{border:1px solid #375e70;background:#122936;color:#d4e4eb;border-radius:9px;padding:8px 10px;cursor:pointer;text-align:center}.box:hover{background:#193746;border-color:#6aa6b5}.arrow{color:#648697}
.c4{display:grid;gap:12px}.boundary{border:1px dashed #3b6072;border-radius:14px;padding:14px}.boundaryTitle{font-size:11px;color:#7ea0b0;text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px}.boxGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:9px}.c4box{background:#102532;border:1px solid #315466;border-radius:11px;padding:11px;cursor:pointer}.c4box:hover{background:#173441}.c4box b{display:block;font-size:13px}.c4box span{font-size:11px;color:#8fa8b6;line-height:1.4;display:block;margin-top:4px}
.catalog{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}.catalogCard{background:#0f202b;border:1px solid #274858;border-radius:12px;padding:12px;cursor:pointer}.catalogCard:hover{border-color:#5b91a2;background:#142d3a}.catalogCard b{display:block}.catalogCard p{font-size:11px;color:#92aab7;margin:5px 0 0;line-height:1.4}
.relRow{display:grid;grid-template-columns:160px 1fr;gap:12px;margin:9px 0}.relLabel{color:#829aa8;font-size:12px;font-weight:700;padding-top:5px}.pill{display:inline-flex;border:1px solid #315466;background:#102631;border-radius:999px;color:#cce0e7;padding:5px 9px;margin:2px 4px 2px 0;font-size:11px;cursor:pointer}.pill:hover{background:#183744}
.stepList{counter-reset:step;list-style:none;padding:0!important}.stepList li{position:relative;padding:9px 10px 9px 42px;margin:7px 0;background:#0f202a;border:1px solid #244250;border-radius:10px}.stepList li:before{counter-increment:step;content:counter(step);position:absolute;left:10px;top:9px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:#214754;color:#dff4f5;font-size:11px;font-weight:800}
.kv{display:grid;grid-template-columns:170px 1fr;gap:8px 14px}.kv>div:nth-child(odd){color:#839ca9;font-weight:700;font-size:12px}.kv>div:nth-child(even){color:#c3d2d9}
.status{display:inline-flex;align-items:center;gap:6px;font-size:10px;padding:4px 7px;border-radius:999px;border:1px solid #53606a;color:#b7c5cc}.status.design{border-color:#8b723d;color:#e4c783;background:#251f12}
.functionTitle{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.functionTitle h1{margin-right:auto}
.localMap{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}.currentBox{padding:14px;border-radius:12px;border:2px solid #67aab7;background:#16323f;font-weight:800;text-align:center}.sideMap{text-align:center}.sideMap .pill{display:block;margin:5px auto;width:max-content;max-width:100%}
.code{background:var(--code);border:1px solid #1d3340;border-radius:10px;padding:10px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:#bdd0da;white-space:pre-wrap}
.sectionHead{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:24px 0 10px}.sectionHead h2{margin:0;font-size:20px}.sectionHead span{font-size:11px;color:#8198a5}
.aIndex{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:7px}.aItem{padding:9px 10px;border:1px solid #213d4b;border-radius:9px;background:#0d1e28;cursor:pointer}.aItem:hover{background:#15303d}.aItem b{display:block;font-size:12px}.aItem span{font-size:10px;color:#8099a7}
.method{font-size:11px;color:#7f96a4}.empty{color:#879ca8;font-style:italic}.small{font-size:11px;color:#8098a5}
@media(max-width:900px){body{overflow:auto}.app{height:auto}.shell{display:block}.shell nav{border-right:0;border-bottom:1px solid var(--line);max-height:310px}.app header{height:auto;padding:10px;flex-wrap:wrap}.search{width:100%;margin:0}.wrap{padding:16px}.grid{grid-template-columns:1fr}.full{grid-column:auto}.lane{grid-template-columns:1fr}.localMap{grid-template-columns:1fr}.kv,.relRow{grid-template-columns:1fr}}
</style>

<script>
const TREE={"id":"root","title":"Orchestrator Agéntico Local v4.0","summary":"Es el sistema central que vamos a construir desde cero en el Mac Studio para convertir solicitudes del usuario en trabajo coordinado entre equipos de agentes. El Orchestrator decidirá qué equipo participa, qué agentes se activan, qué herramientas pueden usar, cómo se verifica el resultado y cómo queda registrado para poder continuar después.","details":["Baseline v4.0: arquitectura greenfield y almacenamiento por niveles; no parte del código del Orchestrator actual.","Host inicial: Mac Studio M1 Max, 32 GB de memoria unificada.","Estrategia: operación local, evidencia antes que afirmaciones y calidad por sobre velocidad.","El Orchestrator existente queda intacto. Sólo podrá consultarse para rescatar una idea útil; cualquier función reutilizada se rediseñará e implementará nuevamente bajo la arquitectura v4.0."],"tag":"Proyecto","children":[{"id":"vision","title":"1. Propósito y Visión","summary":"Construir una plataforma local capaz de recibir objetivos de alto nivel, organizar equipos de agentes, ejecutar trabajo, verificarlo y mantener continuidad del proyecto.","details":["Desarrollo greenfield desde cero.","Calidad y certeza por sobre velocidad.","Autonomía controlada; el usuario conserva autoridad sobre acciones críticas.","Los agentes permanecen en STANDBY y se activan bajo demanda."],"tag":"Dirección","children":[{"id":"greenfield","title":"Desarrollo desde cero (Greenfield)","summary":"El nuevo producto no se construye parchando el Orchestrator anterior.","details":["Repositorio nuevo.","DB y migraciones desde v1.","Tests desde el inicio.","Seguridad, QA y observabilidad by design."],"tag":"","children":[]},{"id":"localfirst","title":"Operación local como principio base","summary":"El sistema se ejecuta inicialmente en el Mac Studio, reduciendo dependencias externas.","details":["llama.cpp / llama-server como runtime local inicial.","Modelos GGUF locales.","VPS reservado como fase futura."],"tag":"","children":[]},{"id":"quality","title":"Calidad y certeza antes que velocidad","summary":"La métrica prioritaria es resultado verificado, no velocidad bruta.","details":["Evidencia y herramientas reales.","Quality Gates.","Revisión independiente.","Golden Tasks y pruebas de regresión."],"tag":"","children":[]},{"id":"human","title":"Autoridad humana","summary":"Acciones críticas no pueden autoaprobarse por consenso o timeout.","details":["Finanzas reales.","Cambios críticos de seguridad.","Publicaciones sensibles.","Eliminación irreversible.","Cambios de privilegios."],"tag":"","children":[]}]},{"id":"core","title":"2. Arquitectura central del Orchestrator","summary":"Arquitectura central del nuevo Orchestrator greenfield. Cada componente se expande hasta mostrar sus responsabilidades, flujo interno, decisiones, datos que consume, resultados y controles.","details":["Cada módulo tendrá responsabilidad y contrato definidos para que pueda probarse y evolucionar sin acoplar todo el sistema.","Las tareas, agentes y aprobaciones sólo podrán pasar entre estados permitidos por código; no dependerán de texto libre generado por el LLM.","Los procesos de trabajo se definirán como configuraciones versionables, no como secuencias ocultas dentro de prompts.","Cada decisión, herramienta, modelo, prompt, resultado, aprobación y control de QA quedará relacionado con la tarea correspondiente."],"tag":"Arquitectura central","children":[{"id":"pmo","title":"PMO y Gerencia del Proyecto","summary":"El PMO será la memoria operativa del proyecto completo. Antes de iniciar una sesión reconstruirá el estado desde la base persistente y documentos de control; al cerrar una sesión actualizará avances, riesgos, decisiones, cambios de alcance, checkpoint y próxima acción.","details":["Carta Gantt, estructura de desglose del trabajo (WBS) y backlog.","Riesgos y problemas activos.","Registro de decisiones.","Registro de alcance.","Registro de dependencias.","Registro de entregables.","Punto de control actual.","Índice maestro de conocimiento del proyecto.","Estado y consistencia de la documentación.","Protocolo RETOMAR PROYECTO."],"tag":"","children":[]},{"id":"task","title":"Gestión del ciclo de vida de las tareas","summary":"Administrará cada trabajo desde que se crea hasta que queda validado o bloqueado. Evitará que un agente marque una tarea como terminada sin pruebas, QA, evidencia y aprobaciones exigidas por su Definition of Done.","details":["CREATED, PLANNING, QUEUED, RUNNING, VERIFYING, WAITING_APPROVAL, BLOCKED, FAILED, DONE, CANCELLED, PAUSED.","Dependencias y prioridades.","Persistencia de estado."],"tag":"","children":[{"id":"tm-start","title":"Creación y planificación","summary":"Registra la tarea y pasa a PLANNING sólo cuando tiene objetivo suficiente.","details":[],"tag":"","children":[{"id":"tm-start-id","title":"Identidad","summary":"task_id, proyecto, prioridad, owner y timestamp.","details":[],"tag":"","children":[]},{"id":"tm-start-scope","title":"Alcance","summary":"Objetivo, restricciones y Definition of Done.","details":[],"tag":"","children":[]}]},{"id":"tm-ready","title":"Cola y preparación","summary":"La tarea queda QUEUED hasta que dependencias y recursos estén disponibles.","details":[],"tag":"","children":[{"id":"tm-ready-dep","title":"Dependencias satisfechas","summary":"No se inicia trabajo con prerequisitos pendientes.","details":[],"tag":"","children":[]},{"id":"tm-ready-res","title":"Recursos disponibles","summary":"Scheduler y Resource Manager validan capacidad.","details":[],"tag":"","children":[]}]},{"id":"tm-run","title":"Ejecución","summary":"Estado RUNNING durante pasos activos del workflow.","details":[],"tag":"","children":[{"id":"tm-run-step","title":"Task Steps","summary":"Cada paso tiene su propio estado, entradas y salida.","details":[],"tag":"","children":[]},{"id":"tm-run-cp","title":"Checkpoint","summary":"Se persiste progreso en puntos seguros.","details":[],"tag":"","children":[]}]},{"id":"tm-verify","title":"Verificación","summary":"Pasa a VERIFYING antes del cierre.","details":[],"tag":"","children":[{"id":"tm-verify-qa","title":"QA","summary":"Comprueba requisitos y Definition of Done.","details":[],"tag":"","children":[]},{"id":"tm-verify-evidence","title":"Evidencia","summary":"Exige pruebas, artifacts o fuentes según el caso.","details":[],"tag":"","children":[]}]},{"id":"tm-final","title":"Estados finales","summary":"Cierre explícito y persistido.","details":[],"tag":"","children":[{"id":"tm-final-done","title":"DONE","summary":"Sólo si todas las gates obligatorias están aprobadas.","details":[],"tag":"","children":[]},{"id":"tm-final-fail","title":"FAILED","summary":"Incluye causa y evidencia del fallo.","details":[],"tag":"","children":[]},{"id":"tm-final-cancel","title":"CANCELLED / PAUSED","summary":"Conserva estado y motivo para continuidad.","details":[],"tag":"","children":[]}]}]},{"id":"planner","title":"Planificador de tareas y descomposición del trabajo","summary":"Cuando el usuario entregue una solicitud de alto nivel, este componente la dividirá en pasos concretos, identificará dependencias, decidirá qué equipo debe intervenir y construirá el plan antes de activar agentes. No ejecutará trabajo directamente: prepara la estrategia.","details":["Objetivos y restricciones.","Selección de equipo.","Dependencias.","Gates y checkpoints."],"tag":"","children":[{"id":"tp-in","title":"1. Entrada de la solicitud","summary":"Recibe la necesidad de alto nivel del usuario y la convierte en una especificación operable.","details":[],"tag":"","children":[{"id":"tp-in-obj","title":"Objetivo","summary":"Qué resultado final espera el usuario y cómo se reconocerá que está cumplido.","details":[],"tag":"","children":[]},{"id":"tp-in-constraints","title":"Restricciones","summary":"Tiempo, seguridad, almacenamiento, herramientas, fuentes y límites explícitos.","details":[],"tag":"","children":[]},{"id":"tp-in-dod","title":"Criterios de aceptación","summary":"Definition of Done, evidencia y formato esperado.","details":[],"tag":"","children":[]}]},{"id":"tp-analysis","title":"2. Análisis de la tarea","summary":"Determina complejidad, dominio, riesgo y dependencias.","details":[],"tag":"","children":[{"id":"tp-analysis-domain","title":"Clasificación de dominio","summary":"Software, Comunicaciones, Comercial, Finanzas, QA, Cybersecurity o SecOps.","details":[],"tag":"","children":[]},{"id":"tp-analysis-risk","title":"Clasificación de riesgo","summary":"Identifica acciones AUTO, SUPERVISED, APPROVAL_REQUIRED o FORBIDDEN.","details":[],"tag":"","children":[]},{"id":"tp-analysis-deps","title":"Dependencias","summary":"Archivos, herramientas, modelo, storage, aprobaciones y pasos previos.","details":[],"tag":"","children":[]}]},{"id":"tp-break","title":"3. Descomposición","summary":"Divide la solicitud en subtareas verificables y ordenadas.","details":[],"tag":"","children":[{"id":"tp-break-gran","title":"Granularidad","summary":"Cada subtarea debe producir una salida concreta y verificable.","details":[],"tag":"","children":[]},{"id":"tp-break-order","title":"Secuencia","summary":"Ordena pasos por dependencia y posibilidad de paralelismo seguro.","details":[],"tag":"","children":[]},{"id":"tp-break-check","title":"Checkpoints","summary":"Define dónde conviene persistir estado para reanudar sin repetir trabajo.","details":[],"tag":"","children":[]}]},{"id":"tp-team","title":"4. Selección de equipo y agentes","summary":"Elige sólo los roles necesarios.","details":[],"tag":"","children":[{"id":"tp-team-min","title":"Equipo mínimo","summary":"Evita activar agentes que no aporten al objetivo.","details":[],"tag":"","children":[]},{"id":"tp-team-review","title":"Separación creador/revisor","summary":"No asigna la aprobación final al mismo agente que produjo el resultado.","details":[],"tag":"","children":[]},{"id":"tp-team-resource","title":"Compatibilidad de recursos","summary":"Respeta la política inicial de un LLM grande concurrente.","details":[],"tag":"","children":[]}]},{"id":"tp-out","title":"5. Plan ejecutable","summary":"Entrega al Workflow Engine un plan estructurado.","details":[],"tag":"","children":[{"id":"tp-out-steps","title":"Pasos y responsables","summary":"Lista de pasos con agente responsable y orden.","details":[],"tag":"","children":[]},{"id":"tp-out-gates","title":"Gates","summary":"QA, seguridad, aprobaciones y criterios para avanzar.","details":[],"tag":"","children":[]},{"id":"tp-out-evidence","title":"Evidencia esperada","summary":"Qué artifacts, tests o fuentes debe producir cada paso.","details":[],"tag":"","children":[]}]}]},{"id":"teams","title":"Gestión y activación de equipos de agentes","summary":"Mantendrá la definición de Software, Comercial, Comunicaciones, Content Studio, Finanzas, QA, Cybersecurity y SecOps. Activará sólo el equipo necesario para una tarea y mantendrá los demás en STANDBY.","details":["Composición del equipo.","Activación bajo demanda.","No implica cargar un modelo por agente."],"tag":"","children":[]},{"id":"registry","title":"Registro y catálogo de agentes","summary":"Será el catálogo oficial de agentes del nuevo sistema. Para cada agente guardará rol, versión del prompt, herramientas autorizadas, memoria accesible, nivel de autonomía, esquema de salida y restricciones. Un agente no podrá autodefinirse permisos adicionales.","details":["Rol y prompt de sistema.","Herramientas autorizadas.","Ámbito de memoria permitido.","Política de autonomía.","Esquema de salida esperado."],"tag":"","children":[]},{"id":"scheduler","title":"Planificador de ejecución y uso de recursos","summary":"En el Mac Studio de 32 GB controlará la cola de trabajo para evitar sobrecargar RAM, contexto o llama-server. Muchos agentes podrán existir lógicamente, pero inicialmente sólo habrá un LLM grande en inferencia a la vez.","details":["STANDBY por defecto.","Colas.","Concurrencia limitada.","Planificación considerando RAM, contexto y recursos disponibles."],"tag":"","children":[]},{"id":"workflow","title":"Motor de flujos de trabajo y orquestación","summary":"Será el motor que recorra los pasos de cada proceso: planificar, ejecutar, verificar, corregir, aprobar y cerrar. Podrá pausar una tarea, esperar una herramienta o aprobación, guardar checkpoint y continuar sin empezar de cero.","details":["Dependencias.","Condiciones.","Reintentos limitados y controlados.","Checkpoint/resume.","Aprobaciones humanas.","Transferencias estructuradas entre agentes."],"tag":"","children":[{"id":"wf-load","title":"Cargar workflow versionado","summary":"Selecciona la definición aplicable a la tarea.","details":[],"tag":"","children":[{"id":"wf-load-schema","title":"Validar esquema","summary":"Comprueba que steps, dependencies, gates y policies sean válidos.","details":[],"tag":"","children":[]},{"id":"wf-load-version","title":"Fijar versión","summary":"La tarea queda vinculada a una versión concreta del workflow.","details":[],"tag":"","children":[]}]},{"id":"wf-step","title":"Ejecutar steps","summary":"Procesa cada paso según dependencias y condiciones.","details":[],"tag":"","children":[{"id":"wf-step-input","title":"Preparar inputs","summary":"Contexto, artifacts, memoria y tools permitidas.","details":[],"tag":"","children":[]},{"id":"wf-step-agent","title":"Despachar agente","summary":"Scheduler activa la sesión lógica correspondiente.","details":[],"tag":"","children":[]},{"id":"wf-step-output","title":"Capturar output","summary":"Registra resultado estructurado, artifacts y evidencia.","details":[],"tag":"","children":[]}]},{"id":"wf-gate","title":"Evaluar gates","summary":"Decide si el flujo avanza, corrige, espera o escala.","details":[],"tag":"","children":[{"id":"wf-gate-qa","title":"QA Gate","summary":"Requisitos, tests y evidencia.","details":[],"tag":"","children":[]},{"id":"wf-gate-sec","title":"Security Gate","summary":"Findings, permisos y secretos.","details":[],"tag":"","children":[]},{"id":"wf-gate-human","title":"Human Approval","summary":"Acciones críticas quedan WAITING_APPROVAL.","details":[],"tag":"","children":[]}]},{"id":"wf-retry","title":"Corrección y reintentos","summary":"Evita loops infinitos.","details":[],"tag":"","children":[{"id":"wf-retry-1","title":"Primer fallo","summary":"Devuelve el error concreto al agente.","details":[],"tag":"","children":[]},{"id":"wf-retry-2","title":"Segundo intento","summary":"Reejecuta sólo lo necesario.","details":[],"tag":"","children":[]},{"id":"wf-retry-escalate","title":"Escalamiento","summary":"Reviewer, especialista o usuario si persiste.","details":[],"tag":"","children":[]}]},{"id":"wf-cp","title":"Checkpoint / Resume","summary":"Persiste suficiente estado para reanudar.","details":[],"tag":"","children":[{"id":"wf-cp-state","title":"Estado","summary":"Step actual, workflow/version, decisiones y pendientes.","details":[],"tag":"","children":[]},{"id":"wf-cp-art","title":"Artifacts","summary":"Referencias, hashes y versiones.","details":[],"tag":"","children":[]},{"id":"wf-cp-resume","title":"Reanudación","summary":"Valida integridad y dependencias antes de continuar.","details":[],"tag":"","children":[]}]}]},{"id":"permission","title":"Control de permisos y privilegios","summary":"Antes de que un agente use una herramienta, este motor comprobará su identidad, el riesgo de la acción y la política aplicable. La seguridad se aplicará en código y Tool Gateway, no sólo mediante instrucciones escritas al LLM.","details":["AUTO.","SUPERVISED.","APPROVAL_REQUIRED.","FORBIDDEN.","Un agente no puede elevar sus propios privilegios."],"tag":"","children":[]},{"id":"approval","title":"Gestión de aprobaciones humanas","summary":"Cuando una tarea intente ejecutar una acción clasificada como crítica, quedará detenida en WAITING_APPROVAL hasta que el usuario apruebe o rechace. El silencio nunca se interpretará como aprobación.","details":["REQUESTED, APPROVED, REJECTED, EXPIRED, CANCELLED.","La ausencia de respuesta nunca significa aprobación."],"tag":"","children":[]},{"id":"policy","title":"Motor de políticas y reglas de operación","summary":"Concentrará reglas que deben cumplirse en todo el Orchestrator: mínimo privilegio, acciones prohibidas, requisitos de QA, restricciones financieras, límites de publicación y reglas de seguridad. Así evitamos repetir reglas contradictorias en cada prompt.","details":["Todo se deniega por defecto salvo autorización explícita.","Políticas versionadas.","Aplicación antes de Tool Gateway."],"tag":"","children":[]},{"id":"context","title":"Gestión inteligente del contexto","summary":"Seleccionará sólo la información necesaria para la tarea actual: políticas, requisitos, evidencia, estado, memoria relevante y documentos específicos. Esto evita desperdiciar contexto de Qwen cargando todo el proyecto en cada llamada.","details":["Prioriza políticas, objetivo, requisitos, evidencia y estado.","Evita inyectar repositorios o memorias completas sin necesidad.","Perfiles de contexto sujetos a benchmark."],"tag":"","children":[]},{"id":"memory","title":"Gestión de memoria operativa y organizacional","summary":"Separará memoria de tarea, agente, equipo, proyecto, empresa y QA. Una tarea de Software no recibirá automáticamente toda la memoria de Comunicaciones o Finanzas; el sistema recuperará sólo lo pertinente.","details":["Memoria de corto plazo.","Memoria de la tarea.","Memoria del agente.","Memoria del equipo.","Memoria del proyecto.","Memoria de la empresa.","Memoria de calidad.","Lecciones aprendidas."],"tag":"","children":[]},{"id":"knowledge","title":"Gestión del conocimiento y sus fuentes","summary":"Indexará documentación y conocimiento útil almacenado principalmente en el SSD externo. Cada pieza deberá conservar procedencia, versión y vigencia para que un agente pueda distinguir conocimiento aprobado de información obsoleta o no verificada.","details":["Procedencia y trazabilidad de la información.","Versionado.","Recuperación selectiva por relevancia.","No mezclar conocimiento sin control de calidad."],"tag":"","children":[]},{"id":"qaengine","title":"Motor de aseguramiento de calidad (QA)","summary":"Ningún entregable importante pasará directamente del agente creador al usuario como 'correcto'. El QA Engine verificará requisitos, pruebas, evidencia, findings y Definition of Done, y podrá devolver el trabajo para corrección.","details":["Cumplimiento de requisitos.","Pruebas aplicables.","Evidencia.","Revisión independiente.","Criterios obligatorios de finalización."],"tag":"","children":[{"id":"qae-req","title":"Gate 1 — Requisitos","summary":"Comprueba que el entregable corresponda al objetivo.","details":[],"tag":"","children":[{"id":"qae-req-map","title":"Trazabilidad","summary":"Relaciona requisito con artifact o evidencia.","details":[],"tag":"","children":[]},{"id":"qae-req-missing","title":"Faltantes","summary":"Cualquier requisito crítico sin cubrir devuelve el trabajo.","details":[],"tag":"","children":[]}]},{"id":"qae-tests","title":"Gate 2 — Pruebas","summary":"Exige tests cuando exista verificación automatizable.","details":[],"tag":"","children":[{"id":"qae-tests-unit","title":"Unitarias / integración","summary":"Según componente afectado.","details":[],"tag":"","children":[]},{"id":"qae-tests-reg","title":"Regresión","summary":"Incluye errores conocidos aplicables.","details":[],"tag":"","children":[]}]},{"id":"qae-evidence","title":"Gate 3 — Evidencia","summary":"Las afirmaciones críticas deben estar respaldadas.","details":[],"tag":"","children":[{"id":"qae-evidence-tool","title":"Resultados de tools","summary":"Logs, linters, consultas, hashes o compilación.","details":[],"tag":"","children":[]},{"id":"qae-evidence-source","title":"Fuentes","summary":"Documentos o fuentes autorizadas cuando corresponda.","details":[],"tag":"","children":[]}]},{"id":"qae-review","title":"Gate 4 — Revisión independiente","summary":"Separa producción y aprobación.","details":[],"tag":"","children":[{"id":"qae-review-agent","title":"Reviewer distinto","summary":"El creador no se autoaprueba.","details":[],"tag":"","children":[]},{"id":"qae-review-status","title":"Estado","summary":"VERIFIED, PARTIALLY_VERIFIED, UNVERIFIED o REJECTED.","details":[],"tag":"","children":[]}]},{"id":"qae-dod","title":"Gate final — Definition of Done","summary":"Sólo habilita DONE cuando no quedan condiciones críticas abiertas.","details":[],"tag":"","children":[{"id":"qae-dod-sec","title":"Findings","summary":"No quedan HIGH/CRITICAL sin resolución o aceptación formal.","details":[],"tag":"","children":[]},{"id":"qae-dod-doc","title":"Documentación","summary":"Cambios relevantes quedan documentados.","details":[],"tag":"","children":[]},{"id":"qae-dod-cp","title":"Checkpoint","summary":"Estado final y continuidad quedan persistidos.","details":[],"tag":"","children":[]}]}]},{"id":"verify","title":"Motor de verificación objetiva","summary":"Cuando exista una forma objetiva de comprobar algo, usará herramientas reales: tests, linters, schemas, checksums, consultas de archivos o evidencia verificable. La opinión del LLM no sustituirá una comprobación disponible.","details":["Pruebas.","Analizadores estáticos y linters.","Esquemas de validación.","Sumas de verificación.","Validación de fuentes/evidencia."],"tag":"","children":[]},{"id":"learning","title":"Motor de aprendizaje a partir de errores","summary":"Cuando exista un error real, el sistema registrará qué ocurrió, analizará causa raíz, aplicará corrección, generará un control preventivo y añadirá una prueba de regresión. El aprendizaje será operacional; no se reentrenarán pesos del modelo por cada error.","details":["Error Registry.","RCA.","Correction.","Preventive Control.","Regression Test.","Lesson Learned."],"tag":"","children":[{"id":"learn-err","title":"1. Error confirmado","summary":"El fallo se registra sólo cuando existe evidencia suficiente.","details":[],"tag":"","children":[{"id":"learn-err-exp","title":"Esperado vs observado","summary":"Define qué debía ocurrir y qué ocurrió.","details":[],"tag":"","children":[]},{"id":"learn-err-sev","title":"Severidad","summary":"Clasifica impacto y prioridad.","details":[],"tag":"","children":[]}]},{"id":"learn-rca","title":"2. Root Cause Analysis","summary":"Busca la causa raíz, no sólo el síntoma.","details":[],"tag":"","children":[{"id":"learn-rca-chain","title":"Cadena causal","summary":"Identifica decisiones, datos o controles que permitieron el fallo.","details":[],"tag":"","children":[]},{"id":"learn-rca-proof","title":"Evidencia","summary":"La causa debe sostenerse con evidencia, no intuición.","details":[],"tag":"","children":[]}]},{"id":"learn-fix","title":"3. Corrección","summary":"Repara el resultado o componente afectado.","details":[],"tag":"","children":[{"id":"learn-fix-local","title":"Corrección inmediata","summary":"Resuelve el problema actual.","details":[],"tag":"","children":[]},{"id":"learn-fix-verify","title":"Verificación","summary":"Comprueba que el arreglo funciona.","details":[],"tag":"","children":[]}]},{"id":"learn-prevent","title":"4. Control preventivo","summary":"Evita que la misma causa se repita.","details":[],"tag":"","children":[{"id":"learn-prevent-policy","title":"Regla/política","summary":"Nueva restricción o validación.","details":[],"tag":"","children":[]},{"id":"learn-prevent-process","title":"Cambio de proceso","summary":"Ajuste de workflow, tool o prompt si corresponde.","details":[],"tag":"","children":[]}]},{"id":"learn-reg","title":"5. Regression Test","summary":"Convierte el error en prueba repetible.","details":[],"tag":"","children":[{"id":"learn-reg-golden","title":"Golden Task","summary":"Si el error afecta capacidades del modelo o sistema.","details":[],"tag":"","children":[]},{"id":"learn-reg-ci","title":"CI local","summary":"Se incorpora al pipeline cuando sea automatizable.","details":[],"tag":"","children":[]}]},{"id":"learn-lesson","title":"6. Lesson Learned","summary":"Publica la lección para los ámbitos aplicables.","details":[],"tag":"","children":[{"id":"learn-lesson-scope","title":"Aplicabilidad","summary":"Agentes, tools, workflows y equipos afectados.","details":[],"tag":"","children":[]},{"id":"learn-lesson-version","title":"Versionado","summary":"La regla queda identificada y auditable.","details":[],"tag":"","children":[]}]}]},{"id":"audit","title":"Auditoría y trazabilidad de acciones","summary":"Creará una trazabilidad técnica por tarea: agente, modelo, prompt, workflow, herramienta, resultado, aprobación, evento de seguridad y QA. Permitirá reconstruir cómo se obtuvo un entregable y detectar dónde falló un proceso.","details":["Agent/task IDs.","Invocaciones de herramientas.","Model/prompt/workflow versions.","Aprobaciones humanas.","Eventos de seguridad.","Resultados de QA."],"tag":"","children":[]},{"id":"securitybus","title":"Bus central de eventos de seguridad","summary":"Recibirá eventos determinísticos del host y del Orchestrator, por ejemplo cambios de archivos, procesos, puertos, permisos, secretos detectados o fallas de backup. Esos eventos podrán activar SecOps sin mantener un LLM funcionando permanentemente.","details":["AUTH_FAILURE.","UNAUTHORIZED_TOOL.","FILE_CHANGED.","PORT_OPENED.","PROCESS_CHANGED.","PROMPT_INJECTION.","SECRET_DETECTED.","BACKUP_FAILURE.","INTEGRITY_FAILURE."],"tag":"","children":[]},{"id":"resource","title":"Gestión de RAM, contexto y recursos","summary":"Vigilará el presupuesto real del Mac Studio: RAM libre, swap, contexto, espacio interno/externo y estado del modelo. Podrá bloquear nuevas cargas o reducir concurrencia antes de que el sistema quede inestable.","details":["Presupuesto de memoria.","Presión de swap.","Espacio interno/externo.","Carga de modelos.","Concurrencia inicial: un LLM grande."],"tag":"","children":[]},{"id":"config","title":"Gestión centralizada de configuración","summary":"Mantendrá DEV, TEST y PROD con configuraciones independientes. Las rutas, puertos, modelo, límites y políticas se validarán al inicio; un error de configuración crítico impedirá arrancar de forma ambigua.","details":["DEV / TEST / PROD.","Validación al arranque.","Sin rutas críticas dispersas en código."],"tag":"","children":[]},{"id":"artifact","title":"Gestión de archivos, resultados y entregables","summary":"Cada documento, imagen, video, dataset o resultado generado tendrá ID, hash, clasificación, procedencia y ubicación. Los archivos voluminosos se guardarán en el SSD externo mientras la DB mantiene sus metadatos y relaciones.","details":["Hash.","Procedencia y trazabilidad de la información.","Classification.","Retention.","Storage tier."],"tag":"","children":[]},{"id":"path","title":"Gestión segura de rutas de almacenamiento","summary":"Será la única capa autorizada para resolver dónde vive un recurso. Usará ORCH_LOCAL_ROOT y ORCH_EXT_ROOT, validará que el SSD externo sea el correcto y evitará rutas hardcodeadas como /Volumes/Varios dentro del código.","details":["ORCH_LOCAL_ROOT.","ORCH_EXT_ROOT.","Protección contra path traversal.","Validación de roots."],"tag":"","children":[]}]},{"id":"runtime","title":"3. Ejecución de agentes e inteligencia artificial local","summary":"Esta capa conectará las definiciones lógicas de agentes con llama-server y las herramientas del Mac. Un agente no será un modelo distinto: será una combinación de rol, prompt, contexto, memoria, permisos y tools ejecutada sobre el modelo local aprobado.","details":[],"tag":"IA","children":[{"id":"agentruntime","title":"Entorno de ejecución de los agentes","summary":"Al activar un agente, construirá una sesión aislada con sus instrucciones, memoria permitida, contexto de la tarea, tools autorizadas y esquema de respuesta. Al terminar, liberará recursos y devolverá el resultado al workflow.","details":["No equivale a un proceso/modelo por agente.","Salida estructurada y validable.","Política de reintentos.","Transferencia controlada a otro agente."],"tag":"","children":[]},{"id":"modelgw","title":"Pasarela de acceso a modelos de IA","summary":"Evitará que el resto del sistema dependa directamente de comandos de llama.cpp. Recibirá una solicitud de inferencia y aplicará el modelo aprobado, perfil de contexto, parámetros y políticas de routing.","details":["Modelo y cuantización.","Perfil de contexto.","Parámetros de generación.","Estado de salud y mecanismo alternativo."],"tag":"","children":[]},{"id":"llama","title":"llama-server","summary":"Será el proceso local que carga el GGUF en el Mac Studio y atiende inferencias por loopback. Los agentes nunca accederán a llama-server sin pasar por Model Gateway y las políticas del Orchestrator.","details":["Metal/Apple Silicon.","GGUF.","API local en loopback.","Modelo activo registrado y versionado."],"tag":"","children":[]},{"id":"modelproc","title":"Gestión del proceso del modelo local","summary":"Gestionará llama-server como servicio controlado: comando reproducible, modelo correcto, PID, health check, alias, contexto y reinicio seguro. Permitirá detectar que el proceso existe pero cargó el modelo equivocado.","details":["Estado de salud.","PID y estado del proceso.","Identidad y versión del modelo.","Configuración reproducible."],"tag":"","children":[]},{"id":"toolgw","title":"Pasarela segura hacia herramientas del sistema","summary":"Los agentes no tendrán shell, filesystem o DB abiertos. Toda acción real pasará por contratos de tools, permisos, timeout, retries, auditoría y políticas de aprobación antes de tocar el Mac o los archivos.","details":["Sistema de archivos.","Git.","Python.","DB.","Terminal restringida.","Herramientas multimedia.","Herramientas de seguridad.","Contratos formales de herramientas."],"tag":"","children":[]},{"id":"structured","title":"Validación de respuestas estructuradas del LLM","summary":"Las respuestas que alimenten otro módulo deberán validar estructura y tipos antes de continuar. Si el modelo devuelve JSON inválido o campos faltantes, el workflow fallará explícitamente o solicitará corrección en vez de interpretar texto ambiguo.","details":["Validación de JSON y esquemas.","Fallos explícitos, nunca silenciosos.","No confiar en texto ambiguo."],"tag":"","children":[]},{"id":"models","title":"Ciclo de vida, evaluación y promoción de modelos","summary":"Gestiona modelos como activos versionados y evaluados.","details":["DISCOVERED.","DOWNLOADED.","TESTING.","APPROVED.","PRIMARY / SECONDARY.","DEPRECATED / REMOVED.","Pruebas maestras antes de promover un modelo."],"tag":"","children":[]}]},{"id":"agents","title":"4. Equipos de Agentes","summary":"Representa todos los departamentos lógicos del nuevo Orchestrator. Cada equipo se expande en sus roles; cada rol se expande a responsabilidad, entradas, proceso, salida y controles. Ningún rol relevante queda sólo como texto lateral.","details":[],"tag":"Organización","children":[{"id":"software","title":"Equipo de Ingeniería de Software","summary":"Diseña, implementa, prueba, revisa y documenta software.","details":["Product Manager.","Architect.","Tech Lead.","Backend/Frontend.","DB/Data.","Security Engineer.","Reviewer.","QA.","Debugger.","DevOps.","Documentation.","Release Manager."],"tag":"","children":[{"id":"sw-pm","title":"Responsable de Producto","summary":"Convierte la necesidad del usuario en alcance, prioridades y criterios de aceptación.","details":["Define el problema y el resultado esperado.","Prioriza funcionalidades.","Mantiene criterios de aceptación y valor esperado."],"tag":"","children":[{"id":"sw-pm-in","title":"Entradas","summary":"Objetivo del usuario, alcance, restricciones y contexto.","details":[],"tag":"","children":[]},{"id":"sw-pm-dec","title":"Decisiones","summary":"Prioridad, alcance funcional y criterios de aceptación.","details":[],"tag":"","children":[]},{"id":"sw-pm-out","title":"Salidas","summary":"Backlog funcional y requisitos listos para arquitectura.","details":[],"tag":"","children":[]}]},{"id":"sw-arch","title":"Arquitecto de Software","summary":"Diseña la arquitectura técnica del nuevo Orchestrator greenfield.","details":["Define componentes e interfaces.","Controla dependencias.","Formaliza decisiones mediante ADR."],"tag":"","children":[{"id":"sw-arch-in","title":"Entradas","summary":"Requisitos aprobados, restricciones del Mac y políticas.","details":[],"tag":"","children":[]},{"id":"sw-arch-dec","title":"Decisiones","summary":"Componentes, contratos, patrones y límites.","details":[],"tag":"","children":[]},{"id":"sw-arch-out","title":"Salidas","summary":"Arquitectura, ADR y especificaciones técnicas.","details":[],"tag":"","children":[]}]},{"id":"sw-tech","title":"Líder Técnico","summary":"Transforma arquitectura en decisiones concretas de implementación y coordina el trabajo técnico.","details":["Estándares de código.","Resolución de bloqueos.","Coherencia técnica."],"tag":"","children":[]},{"id":"sw-back","title":"Desarrollo Backend","summary":"Implementa lógica, servicios, state machines, APIs y persistencia.","details":["Core del Orchestrator.","Integración con DB.","Servicios internos."],"tag":"","children":[]},{"id":"sw-front","title":"Desarrollo Frontend / UI","summary":"Construye la interfaz para operar, observar y aprobar acciones del Orchestrator.","details":["Paneles de tareas/agentes.","Aprobaciones.","PMO, health y auditoría."],"tag":"","children":[]},{"id":"sw-data","title":"DBA / Ingeniería de Datos","summary":"Diseña y mantiene schema, migraciones, integridad, índices y recuperación.","details":["Schema DB v1.","Migraciones.","Integridad y rendimiento."],"tag":"","children":[]},{"id":"sw-sec","title":"Ingeniería de Seguridad","summary":"Aplica controles de seguridad durante el desarrollo.","details":["Secure coding.","Secrets.","Permisos.","Dependencias."],"tag":"","children":[]},{"id":"sw-review","title":"Revisión de Código","summary":"Revisa código producido por otros agentes antes de aceptarlo.","details":["Correctitud.","Arquitectura.","Seguridad.","Legibilidad.","Regresiones."],"tag":"","children":[]},{"id":"sw-qa","title":"QA de Software","summary":"Diseña y ejecuta pruebas funcionales y técnicas.","details":["Unitarias.","Integración.","End-to-end.","Casos negativos.","Regresión."],"tag":"","children":[]},{"id":"sw-debug","title":"Diagnóstico y Debug","summary":"Reproduce, aísla y diagnostica fallos hasta encontrar causa técnica verificable.","details":["Reproducción.","Aislamiento.","Causa raíz técnica.","Corrección verificable."],"tag":"","children":[]},{"id":"sw-devops","title":"DevOps","summary":"Automatiza build, test, entornos, health, despliegue y rollback.","details":["CI/CD local.","DEV/TEST/PROD.","Health checks.","Rollback."],"tag":"","children":[]},{"id":"sw-doc","title":"Documentación Técnica","summary":"Mantiene documentación sincronizada con el código y operación real.","details":["Arquitectura.","Runbooks.","Configuración.","Cambios."],"tag":"","children":[]},{"id":"sw-rel","title":"Gestión de Releases","summary":"Controla que una versión cumpla todos los gates antes de promoción.","details":["Checklist de release.","QA Gate.","Security Gate.","Rollback listo."],"tag":"","children":[]}]},{"id":"commercial","title":"Comercial","summary":"Estrategia comercial, ventas, CRM, pricing y postventa.","details":["Director Comercial.","Marketing.","Sales.","Customer Service.","Post-sales.","CRM Analyst.","Pricing Analyst.","Sales QA."],"tag":"","children":[{"id":"co-dir","title":"Dirección Comercial","summary":"Define estrategia, segmentos, prioridades y objetivos comerciales.","details":[],"tag":"","children":[]},{"id":"co-mark","title":"Marketing","summary":"Diseña posicionamiento, campañas, mensajes y generación de demanda.","details":[],"tag":"","children":[]},{"id":"co-sales","title":"Ventas","summary":"Gestiona oportunidades, propuestas, seguimiento y cierre.","details":[],"tag":"","children":[]},{"id":"co-care","title":"Atención al Cliente","summary":"Recibe, clasifica y responde consultas comerciales.","details":[],"tag":"","children":[]},{"id":"co-post","tit cia, condiciones de avance y responsable de verificación.","details":["PLAN → EXECUTE → VERIFY → CHALLENGE → CORRECT → VALIDATE → LEARN → IMPROVE."],"tag":"Ejecución","children":[{"id":"wdl","title":"Definición declarativa de flujos de trabajo","summary":"Especificación declarativa de pasos, dependencias, gates y condiciones.","details":["Versionable.","No hardcodear workflows en lógica dispersa."],"tag":"","children":[]},{"id":"handoff","title":"Protocolo de comunicación entre agentes","summary":"Formato estructurado para transferir trabajo entre agentes.","details":["task_id.","from_agent / to_agent.","objective.","requirements.","constraints.","artifacts.","evidence.","open_questions."],"tag":"","children":[]},{"id":"tools","title":"Contratos formales de herramientas","summary":"Cada herramienta tiene contrato formal de entrada, salida, riesgo y permisos.","details":["Version.","Input/output schema.","Timeout.","Retries.","Allowed agents.","Approval policy.","Audit."],"tag":"","children":[]},{"id":"retry","title":"Reintentos controlados y escalamiento","summary":"Evita loops infinitos y escala cuando un problema persiste.","details":["Intento inicial.","Corrección con error concreto.","Segundo intento.","Reviewer/specialist.","Escalación humana."],"tag":"","children":[]},{"id":"conflict","title":"Resolución de conflictos","summary":"No se resuelve por mayoría de agentes.","details":["Evidencia > tests > fuentes autorizadas > políticas > reviewer independiente > humano."],"tag":"","children":[]},{"id":"checkpoint","title":"Puntos de control y reanudación de tareas","summary":"Permite pausar y continuar tareas largas con integridad.","details":["Estado actual.","Workflow/version.","Artifacts.","Evidencia.","Decisiones.","Dependencias.","Next action.","Hashes/versiones."],"tag":"","children":[]}]},{"id":"memknowledge","title":"6. Memoria y Conocimiento","summary":"La memoria del sistema estará persistida y segmentada. Cuando un agente se active, se recuperará sólo l const NODES=[{"id":"root","title":"Orchestrator Agéntico Local v4.0","summary":"Es el sistema central que vamos a construir desde cero en el Mac Studio para convertir solicitudes del usuario en trabajo coordinado entre equipos de agentes. El Orchestrator decidirá qué equipo participa, qué agentes se activan, qué herramientas pueden usar, cómo se verifica el resultado y cómo queda registrado para poder continuar después.","details":["Baseline v4.0: arquitectura greenfield y almacenamiento por niveles; no parte del código del Orchestrator actual.","Host inicial: Mac Studio M1 Max, 32 GB de memoria unificada.","Estrategia: operación local, evidencia antes que afirmaciones y calidad por sobre velocidad.","El Orchestrator existente queda intacto. Sólo podrá consultarse para rescatar una idea útil; cualquier función reutilizada se rediseñará e implementará nuevamente bajo la arquitectura v4.0."],"parent":null,"depth":0,"path":["Orchestrator Agéntico Local v4.0"],"children":["vision","core","runtime","agents","workflows","memknowledge","governance","qualitybranch","pmoBranch","cyber","secops","storage","deployment","implementation"]},{"id":"vision","title":"1. Propósito y Visión","summary":"Construir una plataforma local capaz de recibir objetivos de alto nivel, organizar equipos de agentes, ejecutar trabajo, verificarlo y mantener continuidad del proyecto.","details":["Desarrollo greenfield desde cero.","Calidad y certeza por sobre velocidad.","Autonomía controlada; el usuario conserva autoridad sobre acciones críticas.","Los agentes permanecen en STANDBY y se activan bajo demanda."],"parent":"root","depth":1,"path":["Orchestrator Agéntico Local v4.0","1. Propósito y Visión"],"children":["greenfield","localfirst","quality","human"]},{"id":"greenfield","title":"Desarrollo desde cero (Greenfield)","summary":"El nuevo producto no se construye parchando el Orchestrator anterior.","details":["Repositorio nuevo.","DB y migraciones desde v1.","Tests desde el inicio.","Seguridad,  Local v4.0","2. Arquitectura central del Orchestrator","Motor de flujos de trabajo y orquestación","Corrección y reintentos"],"children":["wf-retry-1","wf-retry-2","wf-retry-escalate"]},{"id":"wf-retry-1","title":"Primer fallo","summary":"Devuelve el error concreto al agente.","details":[],"parent":"wf-retry","depth":4,"path":["Orchestrator Agéntico Local v4.0","2. Arquitectura central del Orchestrator","Motor de flujos de trabajo y orquestación","Corrección y reintentos","Primer fallo"],"children":[]},{"id":"wf-retry-2","title":"Segundo intento","summary":"Reejecuta sólo lo necesario.","details":[],"parent":"wf-retry","depth":4,"path":["Orchestrator Agéntico Local v4.0","2. Arquitectura central del Orchestrator","Motor de flujos de trabajo y orquestación","Corrección y reintentos","Segundo intento"],"children":[]},{"id":"wf-retry-escalate","title":"Escalamiento","summary":"Reviewer, especialista o usuario si persiste.","details":[],"parent":"wf-retry","depth":4,"path":["Orchestrator Agéntico Local v4.0","2. Arquitectura central del Orchestrator","Motor de flujos de trabajo y orquestación","Corrección y reintentos","Escalamiento"],"children":[]},{"id":"wf-cp","title":"Checkpoint / Resume","summary":"Persiste suficiente estado para reanudar.","details":[],"parent":"workflow","depth":3,"path":["Orchestrator Agéntico Local v4.0","2. Arquitectura central del Orchestrator","Motor de flujos de trabajo y orquestación","Checkpoint / Resume"],"children":["wf-cp-state","wf-cp-art","wf-cp-resume"]},{"id":"wf-cp-state","title":"Estado","summary":"Step actual, workflow/version, decisiones y pendientes.","details":[],"parent":"wf-cp","depth":4,"path":["Orchestrator Agéntico Local v4.0","2. Arquitectura central del Orchestrator","Motor de flujos de trabajo y orquestación","Checkpoint / Resume","Estado"],"children":[]},{"id":"wf-cp-art","title":"Artifacts","summary":"Referencias, hashes y versiones.","details":[],"parent":"wf-cp","depth":4,"path":["Orchestrator Agéntico Local v4.0","2. Arquitectura central del Orchestrator","Motor de flujos de trabajo y orquestación","Checkpoint / Resume","Artifacts"],"children":[]},{"id":"wf-cp-resume","title":"Reanudación","summary":"Valida integridad y dependencias antes de continuar.","details":[],"parent":"wf-cp","depth":4,"path":["Orchestrator Agéntico Local v4.0","2. Arquitectura central del Orchestrator","Motor de flujos de trabajo y orquestación","Checkpoint / Resume","Reanudación"],"children":[]},{"id":"permission","title":"Control de permisos y privilegios","summary":"Antes de que un agente use una herramienta, este motor comprobará su identidad, el riesgo de la acción y la política aplicable. La seguridad se aplicará en código y Tool Gateway, no sólo mediante instrucciones escritas al LLM.","details":["AUTO.","SUPERVISED.","APPROVAL_REQUIRED.","FORBIDDEN.","Un agente no puede elevar sus propios privilegios."],"parent":"core","depth":2,"path":["Orchestrator Agéntico Local v4.0","2. Arquitectura central del Orchestrator","Control de permisos y privilegios"],"children":[]},{"id":"approval","title":"Gestión de aprobaciones humanas","summary":"Cuando una tarea intente ejecutar una acción clasificada como crítica, quedará detenida en WAITING_APPROVAL hasta que el usuario apruebe o rechace. El silencio nunca se interpretará como aprobación.","details":["REQUESTED, APPROVED, REJECTED, EXPIRED, CANCELLED.","La ausencia de respuesta nunca significa aprobación."],"parent":"core","depth":2,"path":["Orchestrator Agéntico Local v4.0","2. Arquitectura central del Orchestrator","Gestión de aprobaciones humanas"],"children":[]},{"id":"policy","title":"Motor de políticas y reglas de operación","summary":"Concentrará reglas que deben cumplirse en todo el Orchestrator: mínimo privilegio, acciones prohibidas, requisitos de QA, restricciones financieras, límites de publicación y reglas de seguridad. Así evitamos repetir reglas contradictorias en cada prompt.","details":["Todo se deniega por defecto salvo autorización explícita.","Políticas versionadas.","Aplicación antes de Tool Gateway."],"parent":"core","depth":2,"path":["Orchestrator Agéntico Local v4.0","2. Arquitectura central del Orchestrator","Motor de políticas y reglas de operación"],"children":[]},{"id":"context","title":"Gestión inteligente del contexto","summary":"Seleccionará sólo la información necesaria para la tarea actual: políticas, requisitos, evidencia, estado, memoria relevante y documentos específicos. Esto evita desperdiciar contexto de Qwen cargando todo el proyecto en cada llamada.","details":["Prioriza políticas, objetivo, requisitos, evidencia y estado.","Evita inyectar repositorios o memorias completas sin necesidad.","Perfiles de contexto sujetos a benchmark."],"parent":"core","depth":2,"path":["Orchestrator Agéntico Local v4.0","2. Arquitectura central del Orchestrator","Gestión inteligente del contexto"],"children":[]},{"id":"memory","title":"Gestión de memoria operativa y organizacional","summary":"Separará memoria de tarea, agente, equipo, proyecto, empresa y QA. Una tarea de Software no recibirá automáticamente toda la memoria de Comunicaciones o Finanzas; el sistema recuperará sólo lo pertinente.","details":["Memoria de corto plazo.","Memoria de la tarea.","Memoria del agente.","Memoria del equipo.","Memoria del proyecto.","Memoria de la empresa.","Memoria de calidad.","Lecciones aprendidas."],"parent":"core","depth":2,"path":["Orchestrator Agéntico Local v4.0","2. Arquitectura central del Orchestrator","Gestión de memoria operativa y organizacional"],"children":[]},{"id":"knowledge","title":"Gestión del conocimiento y sus fuentes","summary":"Indexará documentación y conocimiento útil almacenado principalmente en el SSD externo. Cada pieza deberá conservar procedencia, versión y vigencia para que un agente pueda distinguir conocimiento aprobado de información obsoleta o no verificada.","details":["Procedencia y trazabilidad de la información.","Versionado.","Recuperación selectiva por relevancia.","No mezclar conocimiento sin control de calidad."],"parent":"core","depth":2,"path":["Orchestrator Agéntico Local v4.0","2. Arquitectura central del Orchestrator","Gestión del conocimiento y sus fuentes"],"children":[]},{"id":"qaengine","title":"Motor de aseguramiento de calidad (QA)","summary":"Ningún entregable importante pasará directamente del agente creador al usuario como 'correcto'. El QA Engine verificará requisitos, pruebas, evidencia, findings y Definition of Done, y podrá devolver el trabajo para corrección.","details":["Cumplimiento de requisitos.","Pruebas aplicables.","Evidencia.","Revisión independiente.","Criterios obligatorios de finalización."],"parent":"core","depth":2,"path":["Orchestrator Agéntico Local v4.0","2. Arquitectura central del Orchestrator","Motor de aseguramiento de calidad (QA)"],"children":["qae-req","qae-tests","qae-evidence","qae-review","qae-dod"]},{"id":"qae-req","title":"Gate 1 — Requisitos","summary":"Comprueba que el entregable corresponda al objetivo.","details":[],"parent":"qaengine","depth":3,"path":["Orchestrator Agéntico Local v4.0","2. Arquitectura central del Orchestrator","Motor de aseguramiento de calidad (QA)","Gate 1 — Requisitos"],"children":["qae-req-map","qae-req-missing"]},{"id":"qae-req-map","title":"Trazabilidad","summary":"Relaciona requisito con artifact o evidencia.","details":[],"parent":"qae-req","depth":4,"path":["Orchestrator Agéntico Local v4.0","2. Arquitectura central del Orchestrator","Motor de aseguramiento de calidad (QA)","Gate 1 — Requisitos","Trazabilidad"],"children":[]},{"id":"qae-req-missing","title":"Faltantes","summary":"Cualquier requisito crítico sin cubrir devuelve el trabajo.","details":[],"parent":"qae-req","depth":4,"path":["Orchestrator Agéntico Local v4.0","2. Arquitectura central del Orchestrator","Motor de aseguramiento de calidad (QA)","Gate 1 — Requisitos","Faltantes"],"children":[]},{"id":"qae-tests","title":"Gate 2 — Pruebas","summary":"Exige tests cuando exista verificación automatizable.","details":[],"parent":"qaengine","depth":3,"path":["Orchestrator Agéntico Local v4.0","2. Arquitectura central del Orchestrator","Motor de aseguramiento de calidad (QA)","Gate 2 — Pruebas"],"children":["qae-tests-unit","qae-tests-reg"]},{"id":"qae-tests-unit","title":"Unitarias / integración","summary":"Según componente afectado.","details":[],"parent":"qae-tests","depth":4,"path":["Orchestrator Agéntico Local v4.0","2. Arquitectura central del Orchestrator","Motor de aseguramiento de calidad (QA)","Gate 2 — Pruebas","Unitarias / integración"],"children":[]},{"id":"qae-tests-reg","title":"Regresión","summary":"Incluye errores conocidos aplicables.","details":[],"parent":"qae-tests","depth":4,"path":["Orchestrator Agéntico Local v4.0","2. Arquitectura central del Orchestrator","Motor de aseguramiento de calidad (QA)","Gate 2 — Pruebas","Regresión"],"children":[]},{"id":"qae-evidence","title":"Gate 3 — Evidencia","summary":"Las afirmaciones críticas deben estar respaldadas.","details":[],"parent":"qaengine","depth":3,"path":["Orchestrator Agéntico Local v4.0","2. Arquitectura central del Orchestrator","Motor de aseguramiento de calidad (QA)","Gate 3 — Evidencia"],"children":["qae-evidence-tool","qae-evidence-source"]},{"id":"qae-evidence-tool","title":"Resultados de tools","summary":"Logs, linters, consultas, hashes o compilación.","details":[],"parent":"qae-evidence","depth":4,"path":["Orchestrator Agéntico Local v4.0","2. Arquitectura central del Orchestrator","Motor de aseguramiento de calidad (QA)","Gate 3 — Evidencia","Resultados de tools"],"children":[]},{"id":"qae-evidence-source","title":"Fuentes","summary":"Documentos o fuentes autorizadas cuando corresponda.","details":[],"parent":"qae-evidence","depth":4,"path":["Orchestrator Agéntico Local v4.0","2. Arquitectura central del Orchestrator","Motor de aseguramiento de calidad (QA)","Gate 3 — Evidencia","Fuentes"],"children":[]},{"id":"qae-review","title":"Gate 4 — Revisión independiente","summary":"Separa producción y aprobación.","details":[],"parent":"qaengine","depth":3,"path":["Orchestrator Agéntico Local v4.0","2. Arquitectura central del Orchestrator","Motor de aseguramiento de calidad (QA)","Gate 4 — Revisión independiente"],"children":["qae-review-agent","qae-review-status"]},{"id":"qae-review-agent","title":"Reviewer distinto","summary":"El creador no se autoaprueba.","details":[],"parent":"qae-review","depth":4,"path":["Orchestrator Agéntico Local v4.0","2. Arquitectura central del Orchestrator","Motor de aseguramiento de calidad (QA)","Gate 4 — Revisión independiente","Reviewer distinto"],"children":[]},{"id":"qae-review-status","title":"Estado","summary":"VERIFIED, PARTIALLY_VERIFIED, UNVERIFIED o REJECTED.","details":[],"parent":"qae-review","depth":4,"path":["Orchestrator Agéntico Local v4.0","2. Arquitectura central del Orchestrator","Motor de aseguramiento de calidad (QA)","Gate 4 — Revisión independiente","Estado"],"children":[]},{"id":"qae-dod","title":"Gate final — Definition of Done","summary":"Sólo habilita DONE cuando no quedan condiciones críticas abiertas.","details":[],"parent":"qaengine","depth":3,"path":["Orchestrator Agéntico Local v4.0","2. Arquitectura central del Orchestrator","Motor de aseguramiento de calidad (QA)","Gate final — Definition of Done"],"children":["qae-dod-sec","qae-dod-doc","qae-dod-cp"]},{"id":"qae-dod-sec","title":"Findings","summary":"No quedan HIGH/CRITICAL sin resolución o aceptación formal.","details":[],"parent":"qae-dod","depth":4,"path":["Orchestrator Agéntico Local v4.0","2. Arquitectura central del Orchestrator","Motor de aseguramiento de calidad (QA)","Gate final — Definition of Done","Findings"],"children":[]},{"id":"qae-dod-doc","title":"Documentación","summary":"Cambios relevantes quedan documentados.","details":[],"parent":"qae-dod","depth":4,"path":["Orchestrator Agéntico Local v4.0","2. Arquitectura central del Orchestrator","Motor de aseguramiento de calidad (QA)","Gate final — Definition of Done","Documentación"],"children":[]},{"id":"qae-dod-cp","title":"Checkpoint","summary":"Estado final y continuidad quedan persistidos.","details":[],"parent":"qae-dod","depth":4,"path":["Orchestrator Agéntico Local v4.0","2. Arquitectura central del Orchestrator","Motor de aseguramiento de calidad (QA)","Gate final — Definition of Done","Checkpoint"],"children":[]},{"id":"verify","title":"Motor de verificación objetiva","summary":"Cuando exista una forma objetiva de comprobar algo, usará herramientas reales: tests, linters, schemas, checksums, consultas de archivos o evidencia verificable. La opinión del LLM no sustituirá una comprobación disponible.","details":["Pruebas.","Analizadores estáticos y linters.","Esquemas de validación.","Sumas de verificación.","Validación de fuentes/evidencia."],"parent":"core","depth":2,"path":["Orchestrator Agéntico Local v4.0","2. Arquitectura central del Orchestrator","Motor de verificación objetiva"],"children":[]},{"id":"learning","title":"Motor de aprendizaje a partir de errores","summary":"Cuando exista un error real, el sistema registrará qué ocurrió, analizará causa raíz, aplicará corrección, generará un control preventivo y añadirá una prueba de regresión. El aprendizaje será operacional; no se reentrenarán pesos del modelo por cada error.","details":["Error Registry.","RCA.","Correction.","Preventive Control.","Regression Test.","Lesson Learned."],"parent":"core","depth":2,"path":["Orchestrator Agéntico Local v4.0","2. Arquitectura central del Orchestrator","Motor de aprendizaje a partir de errores"],"children":["learn-err","learn-rca","learn-fix","learn-prevent","learn-reg","learn-lesson"]},{"id":"learn-err","title":"1. Error confirmado","summary":"El fallo se registra sólo cuando existe evidencia suficiente.","details":[],"parent":"learning","depth":3,"path":["Orchestrator Agéntico Local v4.0","2. Arquitectura central del Orchestrator","Motor de aprendizaje a partir de errores","1. Error confirmado"],"children":["learn-err-exp","learn-err-sev"]},{"id":"learn-err-exp","title":"Esperado vs observado","summary":"Define qué debía ocurrir y qué ocurrió.","details":[],"parent":"learn-err","depth":4,"path":["Orchestrator Agéntico Local v4.0","2. Arquitectura central del Orchestrator","Motor de aprendizaje a partir de errores","1. Error confirmado","Esperado vs observado"],"children":[]},{"id":"learn-err-sev","title":"Severidad","summary":"Clasifica impacto y prioridad.","details":[],"parent":"learn-err","depth":4,"path":["Orchestrator Agéntico Local v4.0","2. Arquitectura central del Orchestrator","Motor de aprendizaje a partir de errores","1. Error confirmado","Severidad"],"children":[]},{"id":"learn-rca","title":"2. Root Cause Analysis","summary":"Busca la causa raíz, no sólo el síntoma.","details":[],"parent":"learning","depth":3,"path":["Orchestrator Agéntico Local v4.0","2. Arquitectura central del Orchestrator","Motor de aprendizaje a partir de errores","2. Root Cause Analysis"],"children":["learn-rca-chain","learn-rca-proof"]},{"id":"learn-rca-chain","title":"Cadena causal","summary":"Identifica decisiones, datos o controles que permitieron el fallo.","details":[],"parent":"learn-rca","depth":4,"path":["Orchestrator Agéntico Local v4.0","2. Arquitectura central del Orchestrator","Motor de aprendizaje a partir de errores","2. Root Cause Analysis","Cadena causal"],"children":[]},{"id":"learn-rca-proof","title":"Evidencia","summary":"La causa debe sostenerse con evidencia, no intuición.","details":[],"parent":"learn-rca","depth":4,"path":["Orchestrator Agéntico Local v4.0","2. Arquitectura central del Orchestrator","Motor de aprendizaje a partir de errores","2. Root Cause Analysis","Evidencia"],"children":[]},{"id":"learn-fix","title":"3. Corrección","summary":"Repara el resultado o componente afectado.","details":[],"parent":"learning","depth":3,"path":["Orchestrator Agéntico Local v4.0","2. Arquitectura central del Orchestrator","Motor de aprendizaje a partir de errores","3. Corrección"],"children":["learn-fix-local","learn-fix-verify"]},{"id":"learn-fix-local","title":"Corrección inmediata","summary":"Resuelve el problema actual.","details":[],"parent":"learn-fix","depth":4,"path":["Orchestrator Agéntico Local v4.0","2. Arquitectura central del Orchestrator","Motor de aprendizaje a partir de errores","3. Corrección","Corrección inmediata"],"children":[]},{"id":"learn-fix-verify","title":"Verificación","summary":"Comprueba que el arreglo funciona.","details":[],"parent":"learn-fix","depth":4,"path":["Orchestrator Agéntico Local v4.0","2. Arquitectura central del Orchestrator","Motor de aprendizaje a partir de errores","3. Corrección","Verificación"],"children":[]},{"id":"learn-prevent","title":"4. Control preventivo","summary":"Evita que la misma causa se repita.","details":[],"parent":"learning","depth":3,"path":["Orchestrator Agéntico Local v4.0","2. Arquitectura central del Orchestrator","Motor de aprendizaje a partir de errores","4. Control preventivo"],"children":["learn-prevent-policy","learn-prevent-process"]},{"id":"learn-prevent-policy","title":"Regla/política","summary":"Nueva restricción o validación.","details":[],"parent":"learn-prevent","depth":4,"path":["Orchestrator Agéntico Local v4.0","2. Arquitectura central del Orchestrator","Motor de aprendizaje a partir de errores","4. Control preventivo","Regla/política"],"children":[]},{"id":"learn-prevent-process","title":"Cambio de proceso","summary":"Ajuste de workflow, tool o prompt si corresponde.","details":[],"parent":"learn-prevent","depth":4,"path":["Orchestrator Agéntico Local v4.0","2. Arquitectura central del Orchestrator","Motor de aprendizaje a partir de errores","4. Control preventivo","Cambio de proceso"],"children":[]},{"id":"learn-reg","title":"5. Regression Test","summary":"Convierte el error en prueba repetible.","details":[],"parent":"learning","depth":3,"path":["Orchestrator Agéntico Local v4.0","2. Arquitectura central del Orchestrator","Motor de aprendizaje a partir de errores","5. Regression Test"],"children":["learn-reg-golden","learn-reg-ci"]},{"id":"learn-reg-golden","title":"Golden Task","summary":"Si el error afecta capacidades del modelo o sistema.","details":[],"parent":"learn-reg","depth":4,"path":["Orchestrator Agéntico Local v4.0","2. Arquitectura central del Orchestrator","Motor de aprendizaje a partir de errores","5. Regression Test","Golden Task"],"children":[]},{"id":"learn-reg-ci","title":"CI local","summary":"Se incorpora al pipeline cuando sea automatizable.","details":[],"parent":"learn-reg","depth":4,"path":["Orchestrator Agéntico Local v4.0","2. Arquitectura central del Orchestrator","Motor de aprendizaje a partir de errores","5. Regression Test","CI local"],"children":[]},{"id":"learn-lesson","title":"6. Lesson Learned","summary":"Publica la lección para los ámbitos aplicables.","details":[],"parent":"learning","depth":3,"path":["Orchestrator Agéntico Local v4.0","2. Arquitectura central del Orchestrator","Motor de aprendizaje a partir de errores","6. Lesson Learned"],"children":["learn-lesson-scope","learn-lesson-version"]},{"id":"learn-lesson-scope","title":"Aplicabilidad","summary":"Agentes, tools, workflows y equipos afectados.","details":[],"parent":"learn-lesson","depth":4,"path":["Orchestrator Agéntico Local v4.0","2. Arquitectura central del Orchestrator","Motor de aprendizaje a partir de errores","6. Lesson Learned","Aplicabilidad"],"children":[]},{"id":"learn-lesson-version","title":"Versionado","summary":"La regla queda identificada y auditable.","details":[],"parent":"learn-lesson","depth":4,"path":["Orchestrator Agéntico Local v4.0","2. Arquitectura central del Orchestrator","Motor de aprendizaje a partir de errores","6. Lesson Learned","Versionado"],"children":[]},{"id":"audit","title":"Auditoría y trazabilidad de acciones","summary":"Creará una trazabilidad técnica por tarea: agente, modelo, prompt, workflow, herramienta, resultado, aprobación, evento de seguridad y QA. Permitirá reconstruir cómo se obtuvo un entregable y detectar dónde falló un proceso.","details":["Agent/task IDs.","Invocaciones de herramientas.","Model/prompt/workflow versions.","Aprobaciones humanas.","Eventos de seguridad.","Resultados de QA."],"parent":"core","depth":2,"path":["Orchestrator Agéntico Local v4.0","2. Arquitectura central del Orchestrator","Auditoría y trazabilidad de acciones"],"children":[]},{"id":"securitybus","title":"Bus central de eventos de seguridad","summary":"Recibirá eventos determinísticos del host y del Orchestrator, por ejemplo cambios de archivos, procesos, puertos, permisos, secretos detectados o fallas de backup. Esos eventos podrán activar SecOps sin mantener un LLM funcionando permanentemente.","details":["AUTH_FAILURE.","UNAUTHORIZED_TOOL.","FILE_CHANGED.","PORT_OPENED.","PROCESS_CHANGED.","PROMPT_INJECTION.","SECRET_DETECTED.","BACKUP_FAILURE.","INTEGRITY_FAILURE."],"parent":"core","depth":2,"path":["Orchestrator Agéntico Local v4.0","2. Arquitectura central del Orchestrator","Bus central de eventos de seguridad"],"children":[]},{"id":"resource","title":"Gestión de RAM, contexto y recursos","summary":"Vigilará el presupuesto real del Mac Studio: RAM libre, swap, contexto, espacio interno/externo y estado del modelo. Podrá bloquear nuevas cargas o reducir concurrencia antes de que el sistema quede inestable.","details":["Presupuesto de memoria.","Presión de swap.","Espacio interno/externo.","Carga de modelos.","Concurrencia inicial: un LLM grande."],"parent":"core","depth":2,"path":["Orchestrator Agéntico Local v4.0","2. Arquitectura central del Orchestrator","Gestión de RAM, contexto y recursos"],"children":[]},{"id":"config","title":"Gestión centralizada de configuración","summary":"Mantendrá DEV, TEST y PROD con configuraciones independientes. Las rutas, puertos, modelo, límites y políticas se validarán al inicio; un error de configuración crítico impedirá arrancar de forma ambigua.","details":["DEV / TEST / PROD.","Validación al arranque.","Sin rutas críticas dispersas en código."],"parent":"core","depth":2,"path":["Orchestrator Agéntico Local v4.0","2. Arquitectura central del Orchestrator","Gestión centralizada de configuración"],"children":[]},{"id":"artifact","title":"Gestión de archivos, resultados y entregables","summary":"Cada documento, imagen, video, dataset o resultado generado tendrá ID, hash, clasificación, procedencia y ubicación. Los archivos voluminosos se guardarán en el SSD externo mientras la DB mantiene sus metadatos y relaciones.","details":["Hash.","Procedencia y trazabilidad de la información.","Classification.","Retention.","Storage tier."],"parent":"core","depth":2,"path":["Orchestrator Agéntico Local v4.0","2. Arquitectura central del Orchestrator","Gestión de archivos, resultados y entregables"],"children":[]},{"id":"path","title":"Gestión segura de rutas de almacenamiento","summary":"Será la única capa autorizada para resolver dónde vive un recurso. Usará ORCH_LOCAL_ROOT y ORCH_EXT_ROOT, validará que el SSD externo sea el correcto y evitará rutas hardcodeadas como /Volumes/Varios dentro del código.","details":["ORCH_LOCAL_ROOT.","ORCH_EXT_ROOT.","Protección contra path traversal.","Validación de roots."],"parent":"core","depth":2,"path":["Orchestrator Agéntico Local v4.0","2. Arquitectura central del Orchestrator","Gestión segura de rutas de almacenamiento"],"children":[]},{"id":"runtime","title":"3. Ejecución de agentes e inteligencia artificial local","summary":"Esta capa conectará las definiciones lógicas de agentes con llama-server y las herramientas del Mac. Un agente no será un modelo distinto: será una combinación de rol, prompt, contexto, memoria, permisos y tools ejecutada sobre el modelo local aprobado.","details":[],"parent":"root","depth":1,"path":["Orchestrator Agéntico Local v4.0","3. Ejecución de agentes e inteligencia artificial local"],"children":["agentruntime","modelgw","llama","modelproc","toolgw","structured","models"]},{"id":"agentruntime","title":"Entorno de ejecución de los agentes","summary":"Al activar un agente, construirá una sesión aislada con sus instrucciones, memoria permitida, contexto de la tarea, tools autorizadas y esquema de respuesta. Al terminar, liberará recursos y devolverá el resultado al workflow.","details":["No equivale a un proceso/modelo por agente.","Salida estructurada y validable.","Política de reintentos.","Transferencia controlada a otro agente."],"parent":"runtime","depth":2,"path":["Orchestrator Agéntico Local v4.0","3. Ejecución de agentes e inteligencia artificial local","Entorno de ejecución de los agentes"],"children":[]},{"id":"modelgw","title":"Pasarela de acceso a modelos de IA","summary":"Evitará que el resto del sistema dependa directamente de comandos de llama.cpp. Recibirá una solicitud de inferencia y aplicará el modelo aprobado, perfil de contexto, parámetros y políticas de routing.","details":["Modelo y cuantización.","Perfil de contexto.","Parámetros de generación.","Estado de salud y mecanismo alternativo."],"parent":"runtime","depth":2,"path":["Orchestrator Agéntico Local v4.0","3. Ejecución de agentes e inteligencia artificial local","Pasarela de acceso a modelos de IA"],"children":[]},{"id":"llama","title":"llama-server","summary":"Será el proceso local que carga el GGUF en el Mac Studio y atiende inferencias por loopback. Los agentes nunca accederán a llama-server sin pasar por Model Gateway y las políticas del Orchestrator.","details":["Metal/Apple Silicon.","GGUF.","API local en loopback.","Modelo activo registrado y versionado."],"parent":"runtime","depth":2,"path":["Orchestrator Agéntico Local v4.0","3. Ejecución de agentes e inteligencia artificial local","llama-server"],"children":[]},{"id":"modelproc","title":"Gestión del proceso del modelo local","summary":"Gestionará llama-server como servicio controlado: comando reproducible, modelo correcto, PID, health check, alias, contexto y reinicio seguro. Permitirá detectar que el proceso existe pero const SCENARIOS={"task":"Una solicitud para añadir checkpoint/resume entra como CREATED. Task Manager no permite pasar directamente a RUNNING: primero exige planificación, dependencias, ejecución, verificación y Definition of Done. Si QA rechaza una prueba, la tarea vuelve a corrección; si falta aprobación, entra en WAITING_APPROVAL.","planner":"El usuario pide «incorporar una vista de salud del sistema». Planner separa requisitos, backend, UI, pruebas y documentación; detecta que la UI depende del contrato del health endpoint; asigna Software Engineering y define un QA Gate antes de TEST.","workflow":"Un workflow de ocho pasos completa los tres primeros y luego espera aprobación humana. Workflow Engine persiste checkpoint, deja la tarea en WAITING_APPROVAL y libera el agente. Tras la aprobación, valida que artifacts y versiones no hayan cambiado y continúa desde el cuarto paso.","permission":"Un Code Reviewer intenta invocar FILE_WRITE. Permission Engine identifica que ese rol sólo puede leer y ejecutar tests; Policy Engine confirma la restricción y la acción se bloquea antes de llegar al sistema operativo. El intento queda auditado.","context":"Para revisar tres archivos Python, Context Manager no carga todo el repositorio ni toda la memoria. Selecciona el requisito, los tres archivos, el diff, dos lessons learned relevantes y la política del reviewer, manteniéndose dentro del presupuesto de contexto.","qaengine":"Una función que exige aprobación para acciones financieras supera los tests normales, pero QA comprueba además el escenario negativo: intentar ejecutar sin aprobación. Tool Gateway debe bloquear. Si no lo hace, QA marca REJECTED aunque el agente desarrollador diga que la función está lista.","checkpoint":"Una tarea larga queda pausada al terminar el día. El checkpoint guarda workflow/version, step actual, artifacts, decisiones, evidencias, dependencias y hashes. Al día siguiente Resume valida integridad y continúa desde el último punto seguro, sin repetir pasos aprobados.","storage":"El SSD externo se desconecta. El sistema conserva DB, config, PMO y audit en TIER-0, marca estado DEGRADED y bloquea sólo las tareas que necesitan modelos, knowledge o artifacts externos. No copia silenciosamente datos voluminosos al SSD interno.","cyber":"Software termina una nueva herramienta. Cybersecurity prueba abuso de permisos, secrets, dependencias y prompt/tool abuse antes de PROD. Un finding HIGH abierto detiene el Security Gate hasta que exista corrección y retest.","secops":"Un monitor detecta un puerto inesperado. Security Event Bus registra proceso, PID, puerto y hora; SecOps clasifica el evento, verifica si está autorizado y aplica sólo respuestas automáticas reversibles. Una acción crítica requiere aprobación humana."};

function relFor(n){
 const down=[...(REL[n.id]||[])].filter(x=>byId.has(x));
 const up=Object.entries(REL).filter(([k,v])=>v.includes(n.id)&&byId.has(k)).map(([k])=>k);
 if(n.parent&&!up.includes(n.parent))up.unshift(n.parent);
 const deps=[];
 for(const id of [...up,...down,...n.children])if(id!==n.id&&byId.has(id)&&!deps.includes(id))deps.push(id);
 return {up:[...new Set(up)],down:[...new Set(down)],related:deps};
}

function search(){
 const q=document.getElementById("q").value.trim().toLowerCase(),host=document.getElementById("searchResults");
 if(!q){host.style.display="none";return}
 const words=q.split(/\\s+/);
 const res=NODES.map(n=>({n,score:words.reduce((s,w)=>s+(n.title.toLowerCase().includes(w)?8:0)+(n.summary.toLowerCase().includes(w)?3:0)+(n.path.join(" ").toLowerCase().includes(w)?1:0),0)})).filter(x=>x.score>0).sort((a,b)=>b.score-a.score).slice(0,18);
 host.innerHTML=res.map(({n})=>'<div class="searchItem" onclick="openNode(\\''+n.id+'\\');document.getElementById(\\'searchResults\\').style.display=\\'none\\';"><b>'+escapeHtml(n.title)+'</b><span>'+escapeHtml(n.path.slice(0,-1).join(" › "))+'</span></div>').join("");
 host.style.display=res.length?"block":"none";
}
document.querySelectorAll(".navBtn").forEach(b=>b.onclick=()=>renderView(b.dataset.view));
document.getElementById("q").addEventListener("input",search);
document.addEventListener("click",e=>{if(!e.target.closest(".search"))document.getElementById("searchResults").style.display="none"});
routeFromHash();
