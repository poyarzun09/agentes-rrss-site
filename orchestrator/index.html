.canvasWrap{position:relative;overflow:hidden;background:

radial-gradient(circle at 80% 70%,rgba(129,201,149,.05),transparent 30%),

.panel p{color:#c4d1d9;line-height:1.55;margin:0 0 16px}
.panel ul{padding-left:20px;color:#c4d1d9;line-height:1.5}
.panel li{margin:7px 0}
.path{font-size:12px;color:#7690a0;margin:14px 0 18px;line-height:1.45}
.nodeActions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.legend{position:absolute;left:16px;bottom:16px;background:rgba(10,21,29,.90);border:1px solid #294354;border-radius:10px;padding:10px 12px;color:#a9bac5;font-size:12px;box-shadow:var(--shadow);pointer-events:none}
svg text{user-select:none}
.link{fill:none;stroke:#3c6378;stroke-width:1.4;opacity:.75}
.node rect{rx:10;ry:10;fill:#122633;stroke:#355466;stroke-width:1}
.node.level1 rect{fill:#18313f;stroke:#4d7185}
.node.root rect{fill:#304259;stroke:#6a88a3;stroke-width:1.5}
.node.selected rect{stroke:#7ed9e0;stroke-width:2.2;filter:drop-shadow(0 0 7px rgba(126,217,224,.28))}
.node.match rect{stroke:#f2c879;stroke-width:2.1}
.node text{fill:#e8f0f4;font-size:13px;pointer-events:none}
.node .small{fill:#9db0bc;font-size:10px}
.node circle.toggle{fill:#0a141b;stroke:#5c8498;stroke-width:1.2;cursor:pointer}
.node .toggleText{font-size:12px;font-weight:700;fill:#cfe8ed}
.node{cursor:pointer}
.badge{fill:#183443}
.zoomCtl{position:absolute;right:16px;bottom:16px;display:flex;gap:7px}
@media(max-width:900px){

  .panel{position:absolute;right:0;top:0;bottom:0;width:min(390px,92vw);z-index:4;box-shadow:-10px 0 25px rgba(0,0,0,.35)}

}
</style>

"Dependency/SBOM.", "Secrets.", "Supply chain."]}, {"id": "iam", "title": "IAM y mínimo privilegio", "summary": "Identidades, permisos y separación de responsabilidades."}, {"id": "secrets", "title": "Secrets Management", "summary": "Evita exposición de secretos en código, logs, prompts y artifacts."}, {"id": "securitygate", "title": "Security Gate", "summary": "Bloquea PROD ante findings HIGH/CRITICAL no resueltos.", "details": ["Threat model.", "Permissions.", "Secrets.", "Dependencies.", "Audit.", "Backup/restore.", "Rollback.", "AI security tests."]}]}, {"id": "secops", "title": "11. SecOps Local", "tag": "Operations", "summary": "Protección operacional del Mac Studio y Orchestrator local.", "children": [{"id": "endpoint", "title": "Host / Endpoint", "summary": "Monitoreo y hardening del Mac Studio."}, {"id": "process", "title": "Procesos y puertos", "summary": "Detecta cambios, procesos inesperados y exposición de servicios."}, {"id": "integrity", "title": "File Integrity", "summary": "Detecta modificaciones relevantes en archivos/configuración."}, {"id": "logs", "title": "Logs & Events", "summary": "Correlación de eventos operacionales y de seguridad."}, {"id": "backup", "title": "Backup Administration", "summary": "Supervisa backups y pruebas de restauración."}, {"id": "incident", "title": "Incident Response", "summary": "Respuesta por niveles a eventos de seguridad.", "details": ["L1 automático reversible.", "L2 supervisado.", "L3 aprobación humana."]}]}, {"id": "storage", "title": "12. Almacenamiento por Niveles", "tag": "Storage", "summary": "Separa estado crítico de activos voluminosos para proteger el SSD interno y mantener estabilidad.", "children": [{"id": "tier0", "title": "SSD interno — TIER-0", "summary": "Estado crítico y runtime que debe permanecer disponible incluso si el externo falla.", "details": ["Core.", "Binarios.", "venv.", "Config.", "DB activa.", "State/checkpoints.", "Audit activo.", "Logs activos.", "Queues/locks."]}, {"id": "tier1", "title": "SSD externo rápido — TIER-1", "summary": "Capacidad para datos y activos de gran volumen.", "details": ["Modelos.", "Embeddings.", "Knowledge.", "Projects.", "Artifacts.", "Datasets.", "Multimedia.", "Caches.", "Logs archive.", "Backups del Core."]}, {"id": "tier2", "title": "TIER-2 futuro", "summary": "Segunda copia independiente para datos únicos del SSD externo.", "details": ["Un único SSD externo no es backup de sí mismo."]}, {"id": "roots", "title": "ORCH_LOCAL_ROOT / ORCH_EXT_ROOT", "summary": "Abstracción para no hardcodear nombres de discos o rutas físicas."}, {"id": "volumeid", "title": "External Volume Identity", "summary": "Verifica que el volumen montado sea realmente el esperado antes de escribir."}, {"id": "degraded", "title": "Degraded Mode", "summary": "Si el SSD externo no está disponible, el Core sigue operativo pero bloquea tareas dependientes del externo.", "details": ["PMO/DB/config/audit siguen disponibles.", "Model/knowledge/artifact operations quedan bloqueadas.", "Sin copia silenciosa al SSD interno."]}]}, {"id": "deployment", "title": "13. Entornos, CI/CD y Producción", "tag": "Delivery", "summary": "Separación y promoción controlada de DEV, TEST y PROD.", "children": [{"id": "envs", "title": "DEV / TEST / PROD", "summary": "Configuración, DB, logs y artifacts separados por entorno."}, {"id": "cicd", "title": "CI/CD local", "summary": "Pipeline de calidad previo a promociones.", "details": ["Lint.", "Unit.", "Integration.", "Migrations.", "Security.", "Golden Tasks.", "TEST.", "Acceptance.", "PROD."]}, {"id": "upgrade", "title": "Upgrade / Rollback", "summary": "Toda actualización importante debe poder revertirse.", "details": ["Code.", "DB.", "Prompt.", "Workflow.", "Model.", "Runtime."]}, {"id": "health", "title": "Health Checks", "summary": "Estado de Core, runtime, DB, storage, tools, audit y security.", "details": ["HEALTHY.", "DEGRADED.", "UNHEALTHY."]}, {"id": "readiness", "title": "Production Readiness", "summary": "Checklist de preparación antes de declarar PROD.", "details": ["Security Gate.", "Backup/restore.", "Rollback.", "Storage benchmark.", "Acceptance."]}]}, {"id": "implementation", "title": "14. Implementación y Próximos Pasos", "tag": "Roadmap", "summary": "Orden de construcción greenfield del producto.", "children": [{"id": "phase0", "title": "Fase 0 — Preflight", "summary": "Registrar baseline del Mac, seleccionar SSD externo, medirlo y crear los roots."}, {"id": "phase1", "title": "Fase 1 — Fundaciones", "summary": "Config, Path Resolver, DB schema v1, migrations, state machine, registries y audit."}, {"id": "phase2", "title": "Fase 2 — Runtime", "summary": "Model Gateway, Agent Runtime, Scheduler, Workflow Engine, checkpoint/resume."}, {"id": "phase3", "title": "Fase 3 — Gobierno", "summary": "PMO, Permission, Approval y Policy Engine."}, {"id": "phase4", "title": "Fase 4 — Memoria/Knowledge", "summary": "Context, Memory y Knowledge Manager."}, {"id": "phase5", "title": "Fase 5 — QA/Learning", "summary": "QA, Verification, Error Registry, RCA y Lessons Learned."}, {"id": "phase6", "title": "Fases 6–7 — Security/SecOps", "summary": "Cybersecurity, Security Gate y operación segura local."}, {"id": "phase8", "title": "Fase 8 — Software MVP", "summary": "Primer vertical end-to-end con Golden Tasks y aceptación."}, {"id": "phase9", "title": "Fase 9 — Producción local", "summary": "TEST→PROD, backup/restore, rollback y readiness."}, {"id": "future", "title": "Futuro", "summary": "Expansión a equipos empresariales y posterior diseño VPS."}]}]};
const svg = document.getElementById('canvas');
const NS='http://www.w3.org/2000/svg';
let selected=DATA, query='', scale=1, tx=35, ty=30, dragging=false, sx=0, sy=0, stx=0, sty=0;
let collapsed=new Set();

function walk(n, parent=null, path=[]){
  n._parent=parent; n._path=[...path,n.title];
  (n.children||[]).forEach(c=>walk(c,n,n._path));
}
walk(DATA);

function visibleChildren(n){ return collapsed.has(n.id)?[]:(n.children||[]); }
function textMatch(n,q){
  if(!q) return false;
  const s=[n.title,n.summary,...(n.details||[])].join(' ').toLowerCase();
  return s.includes(q.toLowerCase());
}

function layoutTree(){
  const nodes=[], links=[]; let leaf=0;
  function calc(n,depth){
    const ch=visibleChildren(n);
    let y;
    if(!ch.length) y=leaf++*56;
    else {
      const ys=ch.map(c=>calc(c,depth+1));
      y=(Math.min(...ys)+Math.max(...ys))/2;
    }
    const x=depth*270;
    nodes.push({n,x,y,depth});
    ch.forEach(c=>links.push([n,c]));
    return y;
  }
  calc(DATA,0);
  const pos=new Map(nodes.map(o=>[o.n.id,o]));
  return {nodes,links,pos,width:Math.max(...nodes.map(o=>o.x))+260,height:Math.max(leaf*56,500)};
}

function el(name,attrs={}){
  const e=document.createElementNS(NS,name);
  for(const [k,v] of Object.entries(attrs)) e.setAttribute(k,v);
  return e;
}

function render(){
  svg.innerHTML='';
  const g=el('g',{transform:`translate(${tx},${ty}) scale(${scale})`});
  svg.appendChild(g);
  const L=layoutTree();
  L.links.forEach(([a,b])=>{
    const A=L.pos.get(a.id), B=L.pos.get(b.id);
    const x1=A.x+210,y1=A.y+20,x2=B.x,y2=B.y+20,m=(x1+x2)/2;
    g.appendChild(el('path',{class:'link',d:`M ${x1} ${y1} C ${m} ${y1}, ${m} ${y2}, ${x2} ${y2}`}));
  });
  L.nodes.forEach(o=>{
    const n=o.n, group=el('g',{class:`node ${o.depth===0?'root':''} ${o.depth===1?'level1':''} ${selected.id===n.id?'selected':''} ${textMatch(n,query)?'match':''}`,transform:`translate(${o.x},${o.y})`});
    const w=210,h=40;
    group.appendChild(el('rect',{width:w,height:h}));
    const t=el('text',{x:12,y:25});
    let label=n.title.length>29?n.title.slice(0,28)+'…':n.title;
    t.textContent=label; group.appendChild(t);
    if((n.children||[]).length){
      const c=el('circle',{class:'toggle',cx:w+18,cy:20,r:12});
      const tt=el('text',{class:'toggleText',x:w+18,y:24,'text-anchor':'middle'});
      tt.textContent=collapsed.has(n.id)?'+':'−';
      c.addEventListener('click',e=>{e.stopPropagation();toggle(n);});
      group.appendChild(c); group.appendChild(tt);
    }
    group.addEventListener('click',()=>selectNode(n));
    g.appendChild(group);
  });
}

function selectNode(n){
  selected=n;
  document.getElementById('tag').textContent=n.tag || (n._parent?.tag || 'Componente');
  document.getElementById('ptitle').textContent=n.title;
  document.getElementById('ppath').textContent=n._path.join('  ›  ');
  document.getElementById('psummary').textContent=n.summary || 'Sin descripción adicional.';
  const ul=document.getElementById('pdetails'); ul.innerHTML='';
  (n.details||[]).forEach(d=>{const li=document.createElement('li');li.textContent=d;ul.appendChild(li);});
  document.getElementById('toggleBranch').textContent=collapsed.has(n.id)?'Expandir rama':'Colapsar rama';
  render();
}
function toggle(n){
  if(collapsed.has(n.id)) collapsed.delete(n.id); else collapsed.add(n.id);
  render(); if(selected.id===n.id) selectNode(n);
}
document.getElementById('toggleBranch').onclick=()=>toggle(selected);
document.getElementById('expandAll').onclick=()=>{collapsed.clear();render();};
document.getElementById('collapseAll').onclick=()=>{
  collapsed.clear();
  function rec(n){if((n.children||[]).length && n!==DATA) collapsed.add(n.id);(n.children||[]).forEach(rec)} rec(DATA); render();
};
document.getElementById('search').addEventListener('input',e=>{query=e.target.value.trim(); if(query) collapsed.clear(); render();});
document.getElementById('copyText').onclick=async()=>{
  const txt=[selected.title,selected.summary,...(selected.details||[])].filter(Boolean).join('\n• ');
  try{await navigator.clipboard.writeText(txt); document.getElementById('copyText').textContent='Copiado'; setTimeout(()=>document.getElementById('copyText').textContent='Copiar explicación',1200)}catch(e){}
};

function apply(){render();}
document.getElementById('zin').onclick=()=>{scale=Math.min(2.4,scale*1.15);apply()};
document.getElementById('zout').onclick=()=>{scale=Math.max(.28,scale/1.15);apply()};
document.getElementById('zreset').onclick=()=>{scale=1;tx=35;ty=30;apply()};
document.getElementById('fit').onclick=()=>{
  const L=layoutTree(), r=svg.getBoundingClientRect();
  scale=Math.max(.28,Math.min(1,(r.width-80)/(L.width+80),(r.height-80)/(L.height+80)));
  tx=30;ty=30;apply();
};

svg.addEventListener('wheel',e=>{
  e.preventDefault();
  const factor=e.deltaY<0?1.1:1/1.1;
  const rect=svg.getBoundingClientRect(), mx=e.clientX-rect.left,my=e.clientY-rect.top;
  const ns=Math.max(.28,Math.min(2.5,scale*factor));
  tx=mx-(mx-tx)*(ns/scale); ty=my-(my-ty)*(ns/scale); scale=ns; apply();
},{passive:false});
svg.addEventListener('mousedown',e=>{dragging=true;svg.classList.add('dragging');sx=e.clientX;sy=e.clientY;stx=tx;sty=ty;});
window.addEventListener('mousemove',e=>{if(!dragging)return;tx=stx+(e.clientX-sx);ty=sty+(e.clientY-sy);apply();});
window.addEventListener('mouseup',()=>{dragging=false;svg.classList.remove('dragging')});

selectNode(DATA);
setTimeout(()=>document.getElementById('fit').click(),100);
</script>
</body>
